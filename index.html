  const addTrackerItem = useCallback((item) => setTrackerItems((prev) => { const next = [...prev, item]; persist("trackerItems", next); return next; }), []);
  const updateTrackerItem = useCallback((id, data) => setTrackerItems((prev) => { const next = prev.map((it) => it.id === id ? { ...it, ...data } : it); persist("trackerItems", next); return next; }), []);
  const archiveTrackerItem = useCallback((id) => setTrackerItems((prev) => { const next = prev.map((it) => it.id === id ? { ...it, archived: !it.archived } : it); persist("trackerItems", next); return next; }), []);
  const deleteTrackerItem = useCallback((id) => {
    setTrackerItems((prev) => { const next = prev.filter((it) => it.id !== id); persist("trackerItems", next); return next; });
    setTrackerEntries((prev) => { const next = prev.filter((e) => e.itemId !== id); persist("trackerEntries", next); return next; });
  }, []);

  const addTrackerEntry = useCallback((itemId, periodKey, value, note) => setTrackerEntries((prev) => {
    const next = [...prev, { id: uid(), itemId, periodKey, value, note: note || null }];
    persist("trackerEntries", next); return next;
  }), []);
  const updateTrackerEntry = useCallback((entryId, patch) => setTrackerEntries((prev) => {
    const next = prev.map((e) => e.id === entryId ? { ...e, ...patch, note: patch.note || null } : e);
    persist("trackerEntries", next); return next;
  }), []);
  const deleteTrackerEntry = useCallback((itemId, periodKey, wholePeriod, entryId) => setTrackerEntries((prev) => {
    const next = wholePeriod
      ? prev.filter((e) => !(e.itemId === itemId && e.periodKey === periodKey))
      : prev.filter((e) => e.id !== entryId);
    persist("trackerEntries", next); return next;
  }), []);
  const toggleTrackerBool = useCallback((item, periodKey, v) => setTrackerEntries((prev) => {
    const next = v
      ? [...prev.filter((e) => !(e.itemId === item.id && e.periodKey === periodKey)), { id: uid(), itemId: item.id, periodKey, value: true, note: null }]
      : prev.filter((e) => !(e.itemId === item.id && e.periodKey === periodKey));
    persist("trackerEntries", next); return next;
  }), []);
  /* +1 appends a plain entry; -1 walks back the most recent one so the
     history stays a truthful record instead of accumulating negatives. */
  const quickAddTracker = useCallback((item, periodKey, delta) => setTrackerEntries((prev) => {
    let next;
    if (delta > 0) {
      next = [...prev, { id: uid(), itemId: item.id, periodKey, value: delta, note: null }];
    } else {
      let idx = -1;
      for (let i = prev.length - 1; i >= 0; i--) if (prev[i].itemId === item.id && prev[i].periodKey === periodKey) { idx = i; break; }
      if (idx < 0) return prev;
      const e = prev[idx];
      const nv = (e.value || 0) + delta;
      next = nv <= 0 ? prev.filter((_, i) => i !== idx) : prev.map((x, i) => i === idx ? { ...x, value: nv } : x);
    }
    persist("trackerEntries", next); return next;
  }), []);

  /* ---- rollover ---- */
  const overdueTasks = useMemo(() => findOverdueTasks(tasks, todayKey), [tasks, todayKey]);
  const overdueGoals = useMemo(() => findOverdueGoals(goals, curMonthKey, curWeekKey), [goals, curMonthKey, curWeekKey]);

  const rolloverTasks = useCallback(() => {
    setTasks((prev) => {
      const next = prev.map((t) => (!t.completed && t.dateKey < todayKey)
        ? { ...t, dateKey: todayKey, reminderFired: false, rolloverCount: (t.rolloverCount || 0) + 1 } : t);
      persist("tasks", next); return next;
    });
  }, [todayKey]);
  const rolloverGoals = useCallback(() => {
    commitGoals((prev) => prev.map((g) => {
      if (g.completed) return g;
      if (g.type === "monthly" && g.monthKey && g.monthKey < curMonthKey) return { ...g, monthKey: curMonthKey, rolloverCount: (g.rolloverCount || 0) + 1 };
      if (g.type === "weekly" && g.weekKey && g.weekKey < curWeekKey) return { ...g, weekKey: curWeekKey, rolloverCount: (g.rolloverCount || 0) + 1 };

      const cur = dataRef.current;
      const dueTasks = cur.tasks.filter((t) => t.dateKey === todayKey && t.reminderTime && !t.completed && !t.reminderFired && t.reminderTime <= nowKey);
      const dueHabits = cur.habits.filter((h) => h.reminderTime && !habitDaySuccess(h, todayKey) && h.lastReminderKey !== todayKey && h.reminderTime <= nowKey);
      const dueGoals = cur.goals.filter((g) => {
        if (!g.reminderTime || g.completed || g.lastReminderKey === todayKey || g.reminderTime > nowKey) return false;
        if (g.type === "monthly") return g.monthKey === curMonthKey;
        if (g.type === "weekly") return g.weekKey === curWeekKey;
        return false;
      });

      if (dueTasks.length) {
        const ids = new Set(dueTasks.map((t) => t.id));
        setTasks((prev) => { const next = prev.map((t) => ids.has(t.id) ? { ...t, reminderFired: true } : t); persist("tasks", next); return next; });
      }
      if (dueHabits.length) {
        const ids = new Set(dueHabits.map((h) => h.id));
        setHabits((prev) => { const next = prev.map((h) => ids.has(h.id) ? { ...h, lastReminderKey: todayKey } : h); persist("habits", next); return next; });
      }
      if (dueGoals.length) {
        const ids = new Set(dueGoals.map((g) => g.id));
        commitGoals((prev) => prev.map((g) => ids.has(g.id) ? { ...g, lastReminderKey: todayKey } : g));
      }

      const all = [
        ...dueTasks.map((t) => ({ title: t.title, kind: "کار" })),
        ...dueHabits.map((h) => ({ title: h.title, kind: "عادت" })),
        ...dueGoals.map((g) => ({ title: g.title, kind: "هدف" })),
      ];
      playBeep();
      for (const it of all) fireBrowserNotification(`یادآوری ${it.kind}: ${it.title}`, "زمان انجامش رسیده");
      setToast(all.length === 1 ? { title: all[0].title } : { title: `${toFa(all.length)} مورد (${all.map((a) => a.title).join("، ")})` });
    }, 20000);
    return () => clearInterval(interval);
  }, [todayKey, curMonthKey, curWeekKey, commitGoals]);

  const allActiveGoals = useMemo(() => goals.filter((g) => !g.completed), [goals]);
  const visibleItems = useMemo(() => trackerItems.filter((i) => !i.archived), [trackerItems]);

  /* ---- detail + edit routing ---- */
  const detailItem = useMemo(() => {
    if (!detail) return null;
    if (detail.kind === "goal") return goals.find((g) => g.id === detail.id) || null;
    if (detail.kind === "task") return tasks.find((t) => t.id === detail.id) || null;
    if (detail.kind === "habit") return habits.find((h) => h.id === detail.id) || null;
    if (detail.kind === "tracker") return trackerItems.find((it) => it.id === detail.id) || null;
    return null;
  }, [detail, goals, tasks, habits, trackerItems]);

  const DETAIL_TITLES = { goal: "جزئیات هدف", task: "جزئیات کار", habit: "جزئیات عادت", tracker: "جزئیات مورد" };
  const EDIT_TITLES = { goal: "ویرایش هدف", task: "ویرایش کار", habit: "ویرایش عادت", tracker: "ویرایش مورد" };

  function startEdit() { setEditing({ kind: detail.kind, item: detailItem }); setDetail(null); }
  function confirmDelete() {
    const k = detail.kind, id = detail.id;
    setDetail(null);
    if (k === "goal") deleteGoal(id);
    else if (k === "task") deleteTask(id);
    else if (k === "habit") deleteHabit(id);
    else if (k === "tracker") deleteTrackerItem(id);
  }
  function saveEdit(data) {
    const { kind, item } = editing;
    if (kind === "goal") updateGoal(item.id, data);
    else if (kind === "task") updateTask(item.id, data);
    else if (kind === "habit") updateHabit(item.id, data);
    else if (kind === "tracker") updateTrackerItem(item.id, data);
    setEditing(null);
  }

  const themeClass = themeMode === "dark" ? "theme-dark" : themeMode === "light" ? "theme-light" : ("theme-auto" + (systemDark ? " is-dark" : ""));

  return (
    <CategoriesContext.Provider value={categories}>
      <div dir="rtl" className={"app-root " + themeClass}>
        <style>{APP_CSS}</style>
        <Toast toast={toast} onClose={() => setToast(null)} />

        <header className="app-header">
          <div className="app-header-top">
            <span className="app-wordmark">گاه‌نما</span>
            <div className="header-right-group">
              <span className="app-header-date">{PERSIAN_WEEKDAYS[persianWeekdayIndex(today.jy, today.jm, today.jd)]}، {toFa(today.jd)} {PERSIAN_MONTHS[today.jm - 1]}</span>
              <IconBtn onClick={() => updateSettings({ theme: isDark ? "light" : "dark" })} label="تغییر تم">
                {isDark ? <Sun size={16} /> : <Moon size={16} />}
              </IconBtn>
              <IconBtn onClick={() => setSearchOpen(true)} label="جست‌وجو"><Search size={16} /></IconBtn>
              <IconBtn onClick={() => setSettingsOpen(true)} label="تنظیمات"><Settings size={16} /></IconBtn>
            </div>
          </div>
          <SeasonRing jy={today.jy} jm={today.jm} jd={today.jd} />
        </header>

        {!loaded ? (
          <div className="tab-pane"><EmptyState text="در حال بارگذاری…" /></div>
        ) : (
          <>
            {tab === "dashboard" && (
              <DashboardTab today={today} goals={goals} tasks={tasks} habits={habits}
                toggleTask={toggleTask} toggleHabit={toggleHabit} setTab={setTab} openDetail={openDetail}
                overdueTasks={overdueTasks} overdueGoals={overdueGoals}
                rolloverTasks={rolloverTasks} rolloverGoals={rolloverGoals} />
            )}
            {tab === "goals" && (
              <GoalsTab today={today} goals={goals} addGoal={addGoal} toggleGoal={toggleGoal} openDetail={openDetail}
                overdueGoals={overdueGoals} rolloverGoals={rolloverGoals} />
            )}
            {tab === "tasks" && (
              <TasksTab today={today} tasks={tasks} goals={allActiveGoals} addTask={addTask} toggleTask={toggleTask}
                openDetail={openDetail} overdueTasks={overdueTasks} rolloverTasks={rolloverTasks} />
            )}
            {tab === "habits" && (
              <HabitsTab today={today} habits={habits} addHabit={addHabit} toggleHabit={toggleHabit}
                setHabitValue={setHabitValue} openDetail={openDetail} />
            )}
            {tab === "tracker" && (
              <TrackerTab today={today} trackerGroups={trackerGroups} trackerItems={trackerItems} trackerEntries={trackerEntries}
                addGroup={addTrackerGroup} editGroup={editTrackerGroup} deleteGroup={deleteTrackerGroup} archiveGroup={archiveTrackerGroup}
                addItem={addTrackerItem} addEntry={addTrackerEntry} quickAdd={quickAddTracker} toggleBool={toggleTrackerBool}
                openDetail={openDetail} />
            )}
            {tab === "review" && (
              <ReviewTab today={today} tasks={tasks} goals={goals} notes={notes} reviews={reviews}
                saveNote={saveNote} addReview={addReview} deleteReview={deleteReview} />
            )}
          </>
        )}

        <BottomNav tab={tab} setTab={setTab} />

        <SearchSheet open={searchOpen} onClose={() => setSearchOpen(false)}
          goals={goals} tasks={tasks} habits={habits} trackerItems={trackerItems} onOpenDetail={openDetail} />

        <SettingsSheet open={settingsOpen} onClose={() => setSettingsOpen(false)}
          categories={categories} addCategory={addCategory} deleteCategory={deleteCategory}
          settings={settings} updateSettings={updateSettings} />

        <Sheet open={!!detailItem} onClose={closeDetail} title={detail ? DETAIL_TITLES[detail.kind] : ""}>
          {detailItem && (
            <>
              <h3 className="detail-title">{detailItem.title}</h3>
              {detail.kind === "goal" && (
                <GoalDetail goal={detailItem} goals={goals} today={today}
                  onEdit={startEdit} onDelete={confirmDelete} onToggle={toggleGoal}
                  onLogProgress={logGoalProgress} onUpdateEntry={updateGoalEntry} onClearLogEntry={clearGoalLogEntry} />
              )}
              {detail.kind === "task" && (
                <TaskDetail task={detailItem} goals={goals} onEdit={startEdit} onDelete={confirmDelete} onToggle={toggleTask} />
              )}
              {detail.kind === "habit" && (
                <HabitDetail habit={detailItem} today={today} onEdit={startEdit} onDelete={confirmDelete}
                  onToggle={toggleHabit} onSetValue={setHabitValue} />
              )}
              {detail.kind === "tracker" && (
                <TrackerItemDetail item={detailItem} group={trackerGroups.find((g) => g.id === detailItem.groupId)}
                  trackerEntries={trackerEntries} today={today}
                  onEdit={startEdit} onDelete={confirmDelete}
                  onAddEntry={addTrackerEntry} onUpdateEntry={updateTrackerEntry} onDeleteEntry={deleteTrackerEntry}
                  onToggleArchive={archiveTrackerItem} />
              )}
            </>
          )}
        </Sheet>

        <Sheet open={!!editing} onClose={() => setEditing(null)} title={editing ? EDIT_TITLES[editing.kind] : ""}>
          {editing && editing.kind === "goal" && (
            <GoalForm initial={editing.item} monthlyGoals={editing.item.type === "weekly" ? goals.filter((g) => g.type === "monthly") : null} onSave={saveEdit} />
          )}
          {editing && editing.kind === "task" && <TaskForm initial={editing.item} goals={allActiveGoals} onSave={saveEdit} />}
          {editing && editing.kind === "habit" && <HabitForm initial={editing.item} onSave={saveEdit} />}
          {editing && editing.kind === "tracker" && <TrackerItemForm initial={editing.item} onSave={saveEdit} />}
        </Sheet>
      </div>
    </CategoriesContext.Provider>
  );
}

if (ReactDOM.createRoot) {
  ReactDOM.createRoot(document.getElementById("root")).render(<PlanningApp />);
} else {
  ReactDOM.render(<PlanningApp />, document.getElementById("root"));
}

</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
