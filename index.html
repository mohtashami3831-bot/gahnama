/* =========================================================================
   CHARTS — small dependency-free SVG chart components (no recharts).
   ========================================================================= */

function SimpleBarChart({ data, height = 140 }) {
  const vbW = 300;
  const slot = vbW / data.length;
  const barW = slot * 0.5;
  const top = 10, bottom = 22;
  const usable = height - top - bottom;
  return (
    <svg viewBox={`0 0 ${vbW} ${height}`} width="100%" height={height} preserveAspectRatio="none" role="img" aria-label="نمودار روند هفتگی">
      <line x1="0" y1={height - bottom} x2={vbW} y2={height - bottom} stroke="var(--c-border-soft)" strokeWidth="1" />
      {data.map((d, i) => {
        const h = Math.max(2, (d.value / 100) * usable);
        const x = i * slot + (slot - barW) / 2;
        const y = height - bottom - h;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={h} rx="4" fill="var(--c-primary)" />
            <text x={i * slot + slot / 2} y={height - 8} fontSize="9" fill="var(--c-ink-soft)" textAnchor="middle">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function SimpleDonutChart({ data, size = 120 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) return null;
  const r = size * 0.34;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const arcs = data.map((d, i) => {
    const frac = d.value / total;
    const dash = Math.max(0, frac * circumference - 1.5);
    const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.fill} strokeWidth={size * 0.17} strokeDasharray={`${dash} ${circumference - dash}`} strokeDashoffset={-offset} strokeLinecap="round" />;
    offset += frac * circumference;
    return el;
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label="نمودار دسته‌بندی">
      <g transform={`rotate(-90 ${cx} ${cy})`}>{arcs}</g>
    </svg>
  );
}

/* =========================================================================
   JALALI (SHAMSI) CALENDAR — verified conversion (33-year break-cycle rule
   for Jalali leap years + standard Fliegel & Van Flandern JDN algorithm).
   This section is unchanged from the tested version — do not alter without
   re-running the reference-date + round-trip test suite.
   ========================================================================= */

function div(a, b) { return Math.floor(a / b); }
function mod(a, b) { return a - Math.floor(a / b) * b; }

function gregorianToJDN(y, m, d) {
  const a = div(14 - m, 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + div(153 * mm + 2, 5) + 365 * yy + div(yy, 4) - div(yy, 100) + div(yy, 400) - 32045;
}
function jdnToGregorian(jdn) {
  const a = jdn + 32044;
  const b = div(4 * a + 3, 146097);
  const c = a - div(146097 * b, 4);
  const d = div(4 * c + 3, 1461);
  const e = c - div(1461 * d, 4);
  const m = div(5 * e + 2, 153);
  const day = e - div(153 * m + 2, 5) + 1;
  const month = m + 3 - 12 * div(m, 10);
  const year = 100 * b + d - 4800 + div(m, 10);
  return { gy: year, gm: month, gd: day };
}

const JALALI_BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

function jalCal(jy) {
  const bl = JALALI_BREAKS.length;
  const gy = jy + 621;
  let leapJ = -14;
  let jp = JALALI_BREAKS[0];
  let jump = 0, jm, i;
  for (i = 1; i < bl; i += 1) {
    jm = JALALI_BREAKS[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
    jp = jm;
  }
  let n = jy - jp;
  leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
  let leap = mod(mod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap, gy, march };
}
function isLeapJalaliYear(jy) { return jalCal(jy).leap === 0; }
function monthOffset(jm) { return (jm - 1) * 31 - div(jm, 7) * (jm - 7); }

function jalaliToGregorian(jy, jm, jd) {
  const r = jalCal(jy);
  const jdn = gregorianToJDN(r.gy, 3, r.march) + monthOffset(jm) + jd - 1;
  return jdnToGregorian(jdn);
}
function gregorianToJalali(gy, gm, gd) {
  const jdn = gregorianToJDN(gy, gm, gd);
  let jy = gy - 621;
  let r = jalCal(jy);
  let jdn1f = gregorianToJDN(r.gy, 3, r.march);
  if (jdn < jdn1f) {
    jy -= 1;
    r = jalCal(jy);
    jdn1f = gregorianToJDN(r.gy, 3, r.march);
  }
  let k = jdn - jdn1f, jm, jd;
  if (k <= 185) { jm = 1 + div(k, 31); jd = mod(k, 31) + 1; }
  else { k -= 186; jm = 7 + div(k, 30); jd = mod(k, 30) + 1; }
  return { jy, jm, jd };
}
function jalaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalaliYear(jy) ? 30 : 29;
}
function addDaysJalali(jy, jm, jd, days) {
  const g = jalaliToGregorian(jy, jm, jd);
  const jdn = gregorianToJDN(g.gy, g.gm, g.gd) + days;
  const g2 = jdnToGregorian(jdn);
  return gregorianToJalali(g2.gy, g2.gm, g2.gd);
}
function addMonthsJalali(jy, jm, delta) {
  let total = (jy * 12 + (jm - 1)) + delta;
  const ny = div(total, 12);
  const nm = mod(total, 12) + 1;
  return { jy: ny, jm: nm };
}
function persianWeekdayIndex(jy, jm, jd) {
  const g = jalaliToGregorian(jy, jm, jd);
  const jsDay = new Date(g.gy, g.gm - 1, g.gd).getDay(); // 0=Sun..6=Sat
  return (jsDay + 1) % 7; // 0=Sat..6=Fri
}
function getWeekStart(jy, jm, jd) {
  const idx = persianWeekdayIndex(jy, jm, jd);
  return addDaysJalali(jy, jm, jd, -idx);
}
function todayJalali() {
  const t = new Date();
  return gregorianToJalali(t.getFullYear(), t.getMonth() + 1, t.getDate());
}
function dateKey(jy, jm, jd) {
  return `${jy}-${String(jm).padStart(2, "0")}-${String(jd).padStart(2, "0")}`;
}
function monthKey(jy, jm) { return `${jy}-${String(jm).padStart(2, "0")}`; }
function sameDate(a, b) { return a.jy === b.jy && a.jm === b.jm && a.jd === b.jd; }

const PERSIAN_MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const PERSIAN_WEEKDAYS = ["شنبه", "یک‌شنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنج‌شنبه", "جمعه"];
const PERSIAN_WEEKDAYS_SHORT = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
const SEASONS = [
  { name: "بهار", months: [0, 1, 2], color: "var(--c-spring)", soft: "var(--c-spring-soft)" },
  { name: "تابستان", months: [3, 4, 5], color: "var(--c-summer)", soft: "var(--c-summer-soft)" },
  { name: "پاییز", months: [6, 7, 8], color: "var(--c-autumn)", soft: "var(--c-autumn-soft)" },
  { name: "زمستان", months: [9, 10, 11], color: "var(--c-winter)", soft: "var(--c-winter-soft)" },
];
function seasonOfMonth(jm) { return SEASONS.find((s) => s.months.includes(jm - 1)); }

const PERSIAN_DIGITS = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
function toFa(n) { return String(n).replace(/[0-9]/g, (d) => PERSIAN_DIGITS[d]); }
function formatMinutes(mins) {
  if (mins < 60) return `${toFa(mins)} دقیقه`;
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${toFa(h)} ساعت و ${toFa(m)} دقیقه` : `${toFa(h)} ساعت`;
}

/* =========================================================================
   STORAGE
   ========================================================================= */
const STORAGE_KEYS = ["goals", "tasks", "habits", "notes", "reviews", "categories", "trackerGroups", "trackerItems", "trackerLogs", "settings"];

const LS_PREFIX = "gahnama:";
function loadAll() {
  const out = {};
  for (const k of STORAGE_KEYS) {
    try {
      const raw = localStorage.getItem(LS_PREFIX + k);
      out[k] = raw ? JSON.parse(raw) : null;
    } catch (e) {
      out[k] = null;
    }
  }
  return out;
}
function persist(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); }
  catch (e) { console.error("storage error", key, e); }
}

const DEFAULT_SETTINGS = { autoRollover: false };

/* =========================================================================
   GOAL PROGRESS HELPERS
   A goal can be "simple" (manual checkbox) or measurable by count or time.
   Measurable goals accumulate daily entries in progressLog and complete
   themselves once the total reaches the target.
   ========================================================================= */

function isMeasurable(goal) { return goal.targetType === "count" || goal.targetType === "time"; }
function goalProgress(goal) {
  if (!goal.progressLog) return 0;
  let sum = 0;
  for (const k in goal.progressLog) sum += goal.progressLog[k] || 0;
  return sum;
}
function goalProgressText(goal) {
  const p = goalProgress(goal);
  const t = goal.targetValue || 0;
  if (goal.targetType === "time") return `${formatMinutes(p)} از ${formatMinutes(t)}`;
  return `${toFa(p)} از ${toFa(t)}${goal.unit ? " " + goal.unit : ""}`;
}
function goalProgressPct(goal) {
  const t = goal.targetValue || 0;
  if (!t) return 0;
  return Math.min(100, (goalProgress(goal) / t) * 100);
}
function formatAmount(type, value, unit) {
  if (type === "time") return formatMinutes(value);
  return `${toFa(value)}${unit ? " " + unit : ""}`;
}

/* =========================================================================
   ROLLOVER — carrying unfinished items forward. Tasks roll day-to-day,
   weekly goals week-to-week, monthly goals month-to-month. String keys are
   zero-padded, so plain "<" comparison is a valid chronological test.
   ========================================================================= */

function findOverdueTasks(tasks, todayKey) {
  return tasks.filter((t) => !t.completed && t.dateKey < todayKey);
}
function findOverdueGoals(goals, curMonthKey, curWeekKey) {
  return goals.filter((g) => {
    if (g.completed) return false;
    if (g.type === "monthly") return g.monthKey && g.monthKey < curMonthKey;
    if (g.type === "weekly") return g.weekKey && g.weekKey < curWeekKey;
    return false;
  });
}

/* =========================================================================
   REMINDER HELPERS — best-effort browser notification + audible beep +
   in-app toast. Running in a browser tab, these fire while the app is open.
   ========================================================================= */

function requestNotifyPermission() {
  try {
    if (typeof Notification === "undefined") return;
    if (Notification.permission === "default") Notification.requestPermission().catch(() => {});
  } catch (e) { /* not available */ }
}
function fireBrowserNotification(title, body) {
  try {
    if (typeof Notification === "undefined") return;
    if (Notification.permission === "granted") new Notification(title, { body });
  } catch (e) { /* ignore */ }
}
function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
    osc.stop(ctx.currentTime + 0.6);
  } catch (e) { /* ignore */ }
}

function IconBtn({ onClick, children, label, variant = "ghost" }) {
  return (
    <button onClick={onClick} aria-label={label} className={"icon-btn " + (variant === "solid" ? "icon-btn-solid" : "")}>
      {children}
    </button>
  );
}

function ProgressBar({ value, color = "var(--c-primary)", track = "var(--c-border-soft)" }) {
  const pct = Math.max(0, Math.min(100, value));
  return (
    <div className="progress-track" style={{ background: track }}>
      <div className="progress-fill" style={{ width: `${pct}%`, background: color }} />
    </div>
  );
}

const CategoryChip = memo(function CategoryChip({ id, size = "sm" }) {
  const categories = useContext(CategoriesContext);
  const cat = categoryOf(categories, id);
  const palette = COLOR_PALETTE[cat.colorKey] || COLOR_PALETTE.slate;
  return (
    <span className={"chip" + (size === "sm" ? " chip-sm" : "")} style={{ background: palette.soft, color: palette.hex }}>
      <span className="chip-dot" style={{ background: palette.hex }} />
      {cat.label}
    </span>
  );
});

function EmptyState({ text, sub }) {
  return (
    <div className="empty-state">
      <p className="empty-title">{text}</p>
      {sub && <p className="empty-sub">{sub}</p>}

  );
}

  if (!open) return null;
  return (
    <div className="sheet-backdrop" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>

          <IconBtn onClick={onClose} label="بستن"><X size={18} /></IconBtn>
        </div>
        <div className="sheet-body">{children}</div>
      </div>
    </div>
  );
}

function CategoryPicker({ value, onChange }) {
  const categories = useContext(CategoriesContext);
  return (
    <div className="cat-picker">
      {categories.map((c) => {
        const palette = COLOR_PALETTE[c.colorKey] || COLOR_PALETTE.slate;
        const active = value === c.id;
        return (
          <button
            key={c.id} type="button" onClick={() => onChange(c.id)} className="cat-picker-btn"
            style={{
              background: active ? palette.soft : "var(--c-surface)",
              borderColor: active ? palette.hex : "var(--c-border)",

/* =========================================================================
   DURATION PICKER — hours + minutes wheels for every time-based entry.
   ========================================================================= */

function DurationPicker({ hours, minutes, setHours, setMinutes }) {
  return (
    <div className="duration-picker">
      <div className="dp-col">
        <span className="dp-label">ساعت</span>
        <select className="dp-select" value={hours} onChange={(e) => setHours(Number(e.target.value))}>
          {Array.from({ length: 25 }, (_, i) => i).map((h) => <option key={h} value={h}>{toFa(h)}</option>)}
        </select>
      </div>
      <span className="dp-sep">:</span>
      <div className="dp-col">
        <span className="dp-label">دقیقه</span>
        <select className="dp-select" value={minutes} onChange={(e) => setMinutes(Number(e.target.value))}>
          {Array.from({ length: 60 }, (_, i) => i).map((m) => <option key={m} value={m}>{toFa(String(m).padStart(2, "0"))}</option>)}
        </select>
      </div>
    </div>
  );

function DurationSheet({ open, onClose, title, currentMinutes, onAdd, onSet, addLabel = "افزودن به مجموع" }) {
  const [hours, setHours] = useState(0);
  const [minutes, setMinutes] = useState(0);
  useEffect(() => { if (open) { setHours(0); setMinutes(0); } }, [open]);
  const total = hours * 60 + minutes;
  return (
    <Sheet open={open} onClose={onClose} title={title}>
      {currentMinutes !== undefined && (
        <p className="dp-current">مقدار فعلی: <b>{formatMinutes(currentMinutes)}</b></p>
      )}
      <DurationPicker hours={hours} minutes={minutes} setHours={setHours} setMinutes={setMinutes} />
      <button className="primary-btn" disabled={total === 0} onClick={() => { onAdd(total); onClose(); }}>{addLabel}</button>
      {onSet && (
        <button className="secondary-btn" onClick={() => { onSet(total); onClose(); }}>جایگزینی مقدار کل با {formatMinutes(total)}</button>
      )}
    </Sheet>
  );
}

function CountSheet({ open, onClose, title, unit, currentValue, onAdd, onSet }) {
  const [val, setVal] = useState(1);
  useEffect(() => { if (open) setVal(1); }, [open]);
  return (
    <Sheet open={open} onClose={onClose} title={title}>
      {currentValue !== undefined && (
        <p className="dp-current">مقدار فعلی: <b>{toFa(currentValue)}{unit ? " " + unit : ""}</b></p>
      )}
      <label className="field-label">مقدار{unit ? ` (${unit})` : ""}</label>
      <div className="big-stepper">
        <button onClick={() => setVal((v) => Math.max(0, v - 1))} aria-label="کم کردن"><Minus size={16} /></button>
        <input className="text-input big-stepper-input" type="number" inputMode="numeric" value={val} onChange={(e) => setVal(Math.max(0, Number(e.target.value) || 0))} />
        <button onClick={() => setVal((v) => v + 1)} aria-label="زیاد کردن"><Plus size={16} /></button>
      </div>
      <button className="primary-btn" disabled={val === 0} onClick={() => { onAdd(val); onClose(); }}>افزودن به مجموع</button>
      {onSet && <button className="secondary-btn" onClick={() => { onSet(val); onClose(); }}>جایگزینی مقدار کل با {toFa(val)}{unit ? " " + unit : ""}</button>}
    </Sheet>
  );
}

function Toast({ toast, onClose }) {
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(onClose, 6000);
    return () => clearTimeout(t);
  }, [toast, onClose]);
  if (!toast) return null;
  return (
    <div className="toast" onClick={onClose} role="alert">
      <Bell size={15} />
      <span>یادآوری: {toast.title}</span>
    </div>
  );
}

/* =========================================================================
   SEASON RING — the Jalali year splits into exactly 4 three-month seasons,
   a structural fact Gregorian months don't share. The ring shows it.
   ========================================================================= */

function SeasonRing({ jy, jm, jd }) {
  const season = seasonOfMonth(jm);
  const monthLen = jalaliMonthLength(jy, jm);
  const monthPct = (jd / monthLen) * 100;
  return (
    <div className="season-ring-wrap">
      <div className="season-ring">
        {SEASONS.map((s) => (
          <div key={s.name} className="season-group">
            {s.months.map((mi) => {
              const isCurrent = mi + 1 === jm;
              return (
                <div key={mi} className="season-seg" style={{ background: s.soft }}>
                  {isCurrent && <div className="season-seg-fill" style={{ width: `${monthPct}%`, background: s.color }} />}
                </div>
              );
            })}
          </div>
        ))}
      </div>
      <div className="season-ring-label">
        <span style={{ color: season.color, fontWeight: 700 }}>{season.name}</span>
        <span className="dot" /> {PERSIAN_MONTHS[jm - 1]} — روز {toFa(jd)} از {toFa(monthLen)}
      </div>
    </div>
  );
}

const GoalRow = memo(function GoalRow({ goal, linkedTitle, onToggle, onOpen }) {

const HabitRow = memo(function HabitRow({ habit, today, onToggle, onOpen }) {
  const tKey = dateKey(today.jy, today.jm, today.jd);
  const done = !!habit.completions[tKey];
  const streak = habitStreak(habit, today);
  const categories = useContext(CategoriesContext);
  const palette = COLOR_PALETTE[categoryOf(categories, habit.category).colorKey] || COLOR_PALETTE.slate;
  const last7 = useMemo(() => {
    const start = addDaysJalali(today.jy, today.jm, today.jd, -6);
    return Array.from({ length: 7 }, (_, i) => addDaysJalali(start.jy, start.jm, start.jd, i));
  }, [tKey]); // eslint-disable-line react-hooks/exhaustive-deps

  return (
    <li className="habit-card">
      <div className="habit-top">
        <button className={"check-circle" + (done ? " check-circle-done" : "")} onClick={() => onToggle(habit.id, tKey)} aria-label="تغییر وضعیت">
          {done && <Check size={13} strokeWidth={3} />}
        </button>
        <button className="row-body" onClick={() => onOpen({ kind: "habit", id: habit.id })}>
          <span className="list-text">{habit.title}</span>
          {habit.description && <span className="row-desc">{habit.description}</span>}
        </button>
        <CategoryChip id={habit.category} />
      </div>
      <div className="habit-bottom">
        <div className="habit-streak">
          <Flame size={13} color={streak > 0 ? "var(--c-saffron)" : "var(--c-ink-faint)"} strokeWidth={2.4} />
          <span>{toFa(streak)} روز پیاپی</span>
        </div>
        <div className="habit-dots">
          {last7.map((d) => {
            const dk = dateKey(d.jy, d.jm, d.jd);
            const filled = !!habit.completions[dk];
            return <Circle key={dk} size={9} fill={filled ? palette.hex : "none"} color={filled ? palette.hex : "var(--c-border)"} strokeWidth={filled ? 0 : 1.8} />;
          })}
        </div>
      </div>
    </li>
  );
});

function habitStreak(habit, today) {
  let streak = 0;
  let cur = today;
  while (habit.completions[dateKey(cur.jy, cur.jm, cur.jd)]) {
    streak += 1;
    cur = addDaysJalali(cur.jy, cur.jm, cur.jd, -1);
  }
  return streak;
}

function DetailField({ label, children }) {

      <span className="detail-value">{children}</span>
    </div>

function DetailActions({ onEdit, onDelete }) {

    <div className="detail-actions">

function GoalDetail({ goal, goals, today, onEdit, onDelete, onToggle, onLogProgress, onClearLogEntry }) {
  const [amountSheet, setAmountSheet] = useState(false);
  const measurable = isMeasurable(goal);
  const todayKey = dateKey(today.jy, today.jm, today.jd);
  const linked = goal.linkedMonthlyId ? goals.find((g) => g.id === goal.linkedMonthlyId) : null;

  const periodText = goal.type === "monthly"
    ? (() => { const [jy, jm] = goal.monthKey.split("-").map(Number); return `${PERSIAN_MONTHS[jm - 1]} ${toFa(jy)}`; })()
    : (() => { const [jy, jm, jd] = goal.weekKey.split("-").map(Number); const end = addDaysJalali(jy, jm, jd, 6); return `${toFa(jd)} ${PERSIAN_MONTHS[jm - 1]} تا ${toFa(end.jd)} ${PERSIAN_MONTHS[end.jm - 1]}`; })();

  const logEntries = Object.keys(goal.progressLog || {}).sort().reverse();

  return (
    <>
      <DetailField label="دسته‌بندی"><CategoryChip id={goal.category} /></DetailField>
      <DetailField label="نوع">{goal.type === "monthly" ? "هدف ماهانه" : "هدف هفتگی"}</DetailField>
      <DetailField label="بازه">{periodText}</DetailField>
      {linked && <DetailField label="مرتبط با">{linked.title}</DetailField>}
      {goal.rolloverCount > 0 && <DetailField label="انتقال">{toFa(goal.rolloverCount)} بار از بازهٔ قبل منتقل شده</DetailField>}
      {goal.description && <DetailField label="توضیحات"><span className="detail-desc">{goal.description}</span></DetailField>}

      {measurable ? (
        <div className="detail-progress">
          <div className="detail-progress-head">
            <span>پیشرفت</span>
            <b>{goalProgressText(goal)}</b>
          </div>
          <ProgressBar value={goalProgressPct(goal)} color={goal.completed ? "var(--c-success)" : "var(--c-primary)"} />
          {goal.completed && <p className="detail-done-note"><Check size={13} /> به هدف رسیدی</p>}
          <button className="primary-btn" onClick={() => setAmountSheet(true)}>
            <Plus size={15} /> ثبت پیشرفت امروز
          </button>

          {logEntries.length > 0 && (
            <>
              <span className="detail-label detail-log-title">ثبت‌های روزانه</span>
              <ul className="log-list">
                {logEntries.map((dk) => {
                  const [jy, jm, jd] = dk.split("-").map(Number);
                  return (
                    <li key={dk} className="log-row">
                      <span>{toFa(jd)} {PERSIAN_MONTHS[jm - 1]}{dk === todayKey ? " (امروز)" : ""}</span>
                      <span className="log-val">{formatAmount(goal.targetType, goal.progressLog[dk], goal.unit)}</span>
                      <IconBtn onClick={() => onClearLogEntry(goal.id, dk)} label="حذف این ثبت"><Trash2 size={13} /></IconBtn>
                    </li>
                  );
                })}
              </ul>
            </>
          )}
        </div>
      ) : (
        <button className={"toggle-big-btn" + (goal.completed ? " toggle-big-done" : "")} onClick={() => onToggle(goal.id)}>
          {goal.completed ? <><Check size={15} /> انجام شده — برگرداندن</> : "علامت‌گذاری به‌عنوان انجام‌شده"}
        </button>
      )}

      <DetailActions onEdit={onEdit} onDelete={onDelete} />

      {goal.targetType === "time" && (
        <DurationSheet
          open={amountSheet} onClose={() => setAmountSheet(false)} title="ثبت زمان انجام‌شده"
          currentMinutes={goalProgress(goal)}
          onAdd={(mins) => onLogProgress(goal.id, todayKey, mins)}
        />
      )}
      {goal.targetType === "count" && (
        <CountSheet
          open={amountSheet} onClose={() => setAmountSheet(false)} title="ثبت مقدار انجام‌شده"
          unit={goal.unit} currentValue={goalProgress(goal)}
          onAdd={(v) => onLogProgress(goal.id, todayKey, v)}
        />
      )}
    </>
  );
}

  const todayKey = dateKey(today.jy, today.jm, today.jd);
  const current = trackerLogs[`${item.id}:${todayKey}`] || (item.type === "boolean" ? false : 0);
  const last14 = useMemo(() => {
    const start = addDaysJalali(today.jy, today.jm, today.jd, -13);
    return Array.from({ length: 14 }, (_, i) => addDaysJalali(start.jy, start.jm, start.jd, i));
  }, [todayKey]); // eslint-disable-line react-hooks/exhaustive-deps
  const typeLabel = (TRACKER_TYPES.find((t) => t.id === item.type) || {}).label;

  return (
    <>
      <DetailField label="نوع ثبت">{typeLabel}</DetailField>
      {item.unit && <DetailField label="واحد">{item.unit}</DetailField>}
      {item.description && <DetailField label="توضیحات"><span className="detail-desc">{item.description}</span></DetailField>}

      <div className="detail-progress">
        <div className="detail-progress-head">
          <span>مقدار امروز</span>

          const dk = dateKey(d.jy, d.jm, d.jd);
          const v = trackerLogs[`${item.id}:${dk}`];
          if (v === undefined || v === false || v === 0) return null;
          return (
            <li key={dk} className="log-row">
              <span>{toFa(d.jd)} {PERSIAN_MONTHS[d.jm - 1]}{dk === todayKey ? " (امروز)" : ""}</span>
              <span className="log-val">{item.type === "boolean" ? "✓" : formatAmount(item.type, v, item.unit)}</span>
            </li>
          );
        })}
      </ul>

      <DetailActions onEdit={onEdit} onDelete={onDelete} />

      {item.type === "time" && (
        <DurationSheet open={sheet} onClose={() => setSheet(false)} title="ثبت زمان"
          currentMinutes={current}
          onAdd={(mins) => onSetLog(item.id, todayKey, current + mins)}
          onSet={(mins) => onSetLog(item.id, todayKey, mins)} />
      )}
      {item.type === "count" && (
        <CountSheet open={sheet} onClose={() => setSheet(false)} title="ثبت مقدار" unit={item.unit}
          currentValue={current}
          onAdd={(v) => onSetLog(item.id, todayKey, current + v)}
          onSet={(v) => onSetLog(item.id, todayKey, v)} />
      )}
    </>
  );
}

function GoalForm({ initial, monthlyGoals, onSave }) {
  const categories = useContext(CategoriesContext);
  const [title, setTitle] = useState(initial?.title || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [category, setCategory] = useState(initial?.category || categories[0]?.id || "");
  const [linkedMonthlyId, setLinkedMonthlyId] = useState(initial?.linkedMonthlyId || "");
  const [targetType, setTargetType] = useState(initial?.targetType || "simple");
  const [unit, setUnit] = useState(initial?.unit || "");
  const [countTarget, setCountTarget] = useState(initial?.targetType === "count" ? initial.targetValue : 10);
  const initMins = initial?.targetType === "time" ? initial.targetValue : 0;
  const [tHours, setTHours] = useState(Math.floor(initMins / 60));
  const [tMinutes, setTMinutes] = useState(initMins % 60);

  const timeTarget = tHours * 60 + tMinutes;
  const targetValue = targetType === "count" ? countTarget : targetType === "time" ? timeTarget : null;
  const valid = title.trim() && (targetType === "simple" || (targetValue && targetValue > 0));

  return (
    <div className="form">
      <label className="field-label">عنوان هدف</label>
      <input className="text-input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="مثلاً: تمام کردن فصل سوم کتاب" autoFocus />

      <label className="field-label">توضیحات (اختیاری)</label>

      <label className="field-label">دسته‌بندی</label>
      <CategoryPicker value={category} onChange={setCategory} />

      <label className="field-label">نحوهٔ سنجش</label>
      <div className="segmented">
        <button className={targetType === "simple" ? "seg-active" : ""} onClick={() => setTargetType("simple")}>ساده</button>
        <button className={targetType === "count" ? "seg-active" : ""} onClick={() => setTargetType("count")}>تعدادی</button>
        <button className={targetType === "time" ? "seg-active" : ""} onClick={() => setTargetType("time")}>زمانی</button>
      </div>

      {targetType === "count" && (
        <>
          <label className="field-label">مقدار هدف</label>
          <div className="big-stepper">
            <button onClick={() => setCountTarget((v) => Math.max(1, v - 1))} aria-label="کم کردن"><Minus size={16} /></button>
            <input className="text-input big-stepper-input" type="number" inputMode="numeric" value={countTarget} onChange={(e) => setCountTarget(Math.max(1, Number(e.target.value) || 1))} />
            <button onClick={() => setCountTarget((v) => v + 1)} aria-label="زیاد کردن"><Plus size={16} /></button>
          </div>
          <label className="field-label">واحد (اختیاری)</label>
          <input className="text-input" value={unit} onChange={(e) => setUnit(e.target.value)} placeholder="مثلاً: صفحه، جلسه، بار" />
        </>
      )}

      {targetType === "time" && (
        <>
          <label className="field-label">زمان هدف</label>
          <DurationPicker hours={tHours} minutes={tMinutes} setHours={setTHours} setMinutes={setTMinutes} />
        </>
      )}

      {monthlyGoals && monthlyGoals.length > 0 && (
        <>
          <label className="field-label">مرتبط با هدف ماهانه (اختیاری)</label>
          <select className="text-input" value={linkedMonthlyId} onChange={(e) => setLinkedMonthlyId(e.target.value)}>
            <option value="">بدون ارتباط</option>
            {monthlyGoals.map((g) => <option key={g.id} value={g.id}>{g.title}</option>)}
          </select>
        </>
      )}

      <button className="primary-btn" disabled={!valid}
        onClick={() => valid && onSave({
          title: title.trim(), description: description.trim() || null, category,
          linkedMonthlyId: linkedMonthlyId || null,
          targetType, targetValue, unit: targetType === "count" ? (unit.trim() || null) : null,
        })}>
        ذخیره
      </button>
    </div>
  );
}

function DashboardTab({ today, goals, tasks, habits, toggleTask, toggleHabit, setTab, openDetail, overdueTasks, overdueGoals, rolloverTasks, rolloverGoals }) {
  const tKey = dateKey(today.jy, today.jm, today.jd);
  const todaysTasks = tasks.filter((t) => t.dateKey === tKey);
  const doneTasks = todaysTasks.filter((t) => t.completed).length;
  const doneHabits = habits.filter((h) => h.completions[tKey]).length;

  const mKey = monthKey(today.jy, today.jm);
  const monthlyGoals = goals.filter((g) => g.type === "monthly" && g.monthKey === mKey);
  const monthDone = monthlyGoals.filter((g) => g.completed).length;

  const weekStart = getWeekStart(today.jy, today.jm, today.jd);
  const wKey = dateKey(weekStart.jy, weekStart.jm, weekStart.jd);
  const weeklyGoals = goals.filter((g) => g.type === "weekly" && g.weekKey === wKey);
  const weekDone = weeklyGoals.filter((g) => g.completed).length;

  return (
    <div className="tab-pane">
      <RolloverBanner count={overdueTasks.length} label="کار انجام‌نشده از روزهای گذشته" onRollover={rolloverTasks} />
      <RolloverBanner count={overdueGoals.length} label="هدف ناتمام از بازه‌های گذشته" onRollover={rolloverGoals} />

      <div className="stat-row">
        <div className="stat-card"><span className="stat-num">{toFa(doneTasks)}/{toFa(todaysTasks.length)}</span><span className="stat-label">وظیفه امروز</span></div>
        <div className="stat-card"><span className="stat-num">{toFa(doneHabits)}/{toFa(habits.length)}</span><span className="stat-label">عادت امروز</span></div>
        <div className="stat-card"><span className="stat-num">{toFa(monthDone)}/{toFa(monthlyGoals.length)}</span><span className="stat-label">هدف این ماه</span></div>
      </div>

      <section className="section">
        <div className="section-head"><h3>وظایف امروز</h3><button className="link-btn" onClick={() => setTab("tasks")}>مشاهده همه</button></div>
        {todaysTasks.length === 0 ? (
          <EmptyState text="امروز کاری ثبت نشده" sub="از تب وظایف یکی اضافه کن" />
        ) : (
          <ul className="list">
            {todaysTasks.slice(0, 5).map((t) => <TaskRow key={t.id} task={t} onToggle={toggleTask} onOpen={openDetail} />)}
          </ul>
        )}
      </section>

      <section className="section">
        <div className="section-head"><h3>عادت‌های امروز</h3><button className="link-btn" onClick={() => setTab("habits")}>مشاهده همه</button></div>
        {habits.length === 0 ? (
          <EmptyState text="هنوز عادتی ثبت نشده" sub="از تب عادت‌ها یکی اضافه کن" />
        ) : (
          <ul className="list">
            {habits.slice(0, 5).map((h) => {
              const done = !!h.completions[tKey];
              return (
                <li key={h.id} className="list-row">
                  <button className={"check-circle" + (done ? " check-circle-done" : "")} onClick={() => toggleHabit(h.id, tKey)} aria-label="تغییر وضعیت">
                    {done && <Check size={13} strokeWidth={3} />}
                  </button>
                  <button className="row-body" onClick={() => openDetail({ kind: "habit", id: h.id })}>
                    <span className={"list-text" + (done ? " list-text-done" : "")}>{h.title}</span>
                  </button>
                  <CategoryChip id={h.category} />
                </li>
              );
            })}
          </ul>
        )}
      </section>

      {(monthlyGoals.length > 0 || weeklyGoals.length > 0) && (
        <section className="section">
          <div className="section-head"><h3>پیشرفت اهداف</h3></div>
          {monthlyGoals.length > 0 && (
            <div className="goal-progress-row">
              <div className="goal-progress-label">هدف‌های ماهانه</div>
              <ProgressBar value={(monthDone / monthlyGoals.length) * 100} />
            </div>
          )}
          {weeklyGoals.length > 0 && (
            <div className="goal-progress-row">
              <div className="goal-progress-label">هدف‌های هفتگی</div>
              <ProgressBar value={(weekDone / weeklyGoals.length) * 100} color="var(--c-saffron)" />
            </div>
          )}
        </section>
      )}
    </div>
  );
}

function GoalsTab({ today, goals, addGoal, toggleGoal, openDetail, overdueGoals, rolloverGoals }) {
  const [mode, setMode] = useState("monthly");
  const [cursor, setCursor] = useState(today);
  const [sheetOpen, setSheetOpen] = useState(false);

  const weekStart = getWeekStart(cursor.jy, cursor.jm, cursor.jd);
  const wKey = dateKey(weekStart.jy, weekStart.jm, weekStart.jd);
  const weekEnd = addDaysJalali(weekStart.jy, weekStart.jm, weekStart.jd, 6);
  const mKey = monthKey(cursor.jy, cursor.jm);

  const shown = mode === "monthly"
    ? goals.filter((g) => g.type === "monthly" && g.monthKey === mKey)
    : goals.filter((g) => g.type === "weekly" && g.weekKey === wKey);
  const allMonthlyGoals = goals.filter((g) => g.type === "monthly");

  function goPrev() {
    if (mode === "monthly") setCursor({ ...addMonthsJalali(cursor.jy, cursor.jm, -1), jd: 1 });
    else setCursor(addDaysJalali(cursor.jy, cursor.jm, cursor.jd, -7));
  }
  function goNext() {
    if (mode === "monthly") setCursor({ ...addMonthsJalali(cursor.jy, cursor.jm, 1), jd: 1 });
    else setCursor(addDaysJalali(cursor.jy, cursor.jm, cursor.jd, 7));
  }
  function handleSave(data) {
    addGoal({
      id: uid(), ...data, type: mode,
      monthKey: mode === "monthly" ? mKey : null,
      weekKey: mode === "weekly" ? wKey : null,
      linkedMonthlyId: mode === "weekly" ? data.linkedMonthlyId : null,
      completed: false, progressLog: {}, rolloverCount: 0,
    });
    setSheetOpen(false);
  }

  return (
    <div className="tab-pane">
      <RolloverBanner count={overdueGoals.length} label="هدف ناتمام از بازه‌های گذشته" onRollover={rolloverGoals} />

      <div className="segmented">
        <button className={mode === "monthly" ? "seg-active" : ""} onClick={() => setMode("monthly")}>ماهانه</button>
        <button className={mode === "weekly" ? "seg-active" : ""} onClick={() => setMode("weekly")}>هفتگی</button>
      </div>

      <div className="period-nav">
        <IconBtn onClick={goPrev} label="قبلی"><ChevronRight size={18} /></IconBtn>
        <span className="period-label">
          {mode === "monthly" ? `${PERSIAN_MONTHS[cursor.jm - 1]} ${toFa(cursor.jy)}` : `${toFa(weekStart.jd)} ${PERSIAN_MONTHS[weekStart.jm - 1]} تا ${toFa(weekEnd.jd)} ${PERSIAN_MONTHS[weekEnd.jm - 1]}`}
        </span>
        <IconBtn onClick={goNext} label="بعدی"><ChevronLeft size={18} /></IconBtn>
      </div>

      {shown.length === 0 ? (
        <EmptyState text={mode === "monthly" ? "هدفی برای این ماه ثبت نشده" : "هدفی برای این هفته ثبت نشده"} sub="با دکمهٔ زیر یک هدف اضافه کن" />
      ) : (
        <ul className="list">
          {shown.map((g) => (
            <GoalRow key={g.id} goal={g} linkedTitle={g.linkedMonthlyId ? goals.find((m) => m.id === g.linkedMonthlyId)?.title : null} onToggle={toggleGoal} onOpen={openDetail} />
          ))}
        </ul>
      )}

      <button className="fab" onClick={() => setSheetOpen(true)} aria-label="افزودن هدف"><Plus size={22} /></button>
      <Sheet open={sheetOpen} onClose={() => setSheetOpen(false)} title={mode === "monthly" ? "هدف ماهانهٔ جدید" : "هدف هفتگی جدید"}>
        <GoalForm monthlyGoals={mode === "weekly" ? allMonthlyGoals : null} onSave={handleSave} />
      </Sheet>
    </div>
  );
}

function TasksTab({ today, tasks, goals, addTask, toggleTask, openDetail, overdueTasks, rolloverTasks }) {
  const [cursor, setCursor] = useState(today);
  const [sheetOpen, setSheetOpen] = useState(false);

  const strip = useMemo(() => {
    const start = addDaysJalali(cursor.jy, cursor.jm, cursor.jd, -3);
    return Array.from({ length: 7 }, (_, i) => addDaysJalali(start.jy, start.jm, start.jd, i));
  }, [cursor.jy, cursor.jm, cursor.jd]);

  const cKey = dateKey(cursor.jy, cursor.jm, cursor.jd);
  const dayTasks = tasks.filter((t) => t.dateKey === cKey);

  return (
    <div className="tab-pane">
      <RolloverBanner count={overdueTasks.length} label="کار انجام‌نشده از روزهای گذشته" onRollover={rolloverTasks} />

      <div className="period-nav">
        <IconBtn onClick={() => setCursor(addDaysJalali(cursor.jy, cursor.jm, cursor.jd, -1))} label="روز قبل"><ChevronRight size={18} /></IconBtn>
        <span className="period-label">{PERSIAN_WEEKDAYS[persianWeekdayIndex(cursor.jy, cursor.jm, cursor.jd)]}، {toFa(cursor.jd)} {PERSIAN_MONTHS[cursor.jm - 1]}</span>
        <IconBtn onClick={() => setCursor(addDaysJalali(cursor.jy, cursor.jm, cursor.jd, 1))} label="روز بعد"><ChevronLeft size={18} /></IconBtn>
      </div>

      <div className="day-strip">
        {strip.map((d) => {
          const isToday = sameDate(d, today);
          const isSel = sameDate(d, cursor);
          return (
            <button key={dateKey(d.jy, d.jm, d.jd)} className={"day-chip" + (isSel ? " day-chip-active" : "") + (isToday ? " day-chip-today" : "")} onClick={() => setCursor(d)}>
              <span className="day-chip-wd">{PERSIAN_WEEKDAYS_SHORT[persianWeekdayIndex(d.jy, d.jm, d.jd)]}</span>
              <span className="day-chip-num">{toFa(d.jd)}</span>
            </button>
          );
        })}
      </div>

      {!sameDate(cursor, today) && <button className="link-btn today-jump" onClick={() => setCursor(today)}>برو به امروز</button>}

      {dayTasks.length === 0 ? (
        <EmptyState text="کاری برای این روز ثبت نشده" sub="با دکمهٔ زیر یکی اضافه کن" />
      ) : (
        <ul className="list">
          {dayTasks.map((t) => <TaskRow key={t.id} task={t} onToggle={toggleTask} onOpen={openDetail} />)}
        </ul>
      )}

      <button className="fab" onClick={() => setSheetOpen(true)} aria-label="افزودن کار"><Plus size={22} /></button>
      <Sheet open={sheetOpen} onClose={() => setSheetOpen(false)} title="کار جدید">
        <TaskForm goals={goals} onSave={(data) => {
          addTask({ id: uid(), ...data, dateKey: cKey, completed: false, reminderFired: false, rolloverCount: 0 });
          setSheetOpen(false);
        }} />
      </Sheet>
    </div>
  );
}

        {item.description && <span className="row-desc">{item.description}</span>}
      </button>
      {item.type === "boolean" && (
        <button className={"check-circle" + (value ? " check-circle-done" : "")} onClick={() => onToggleBool(!value)} aria-label="تغییر وضعیت">
          {value && <Check size={13} strokeWidth={3} />}
        </button>
      )}
      {item.type === "count" && (
        <div className="stepper">
          <button onClick={() => onQuickAdd(-1)} aria-label="کم کردن"><Minus size={13} /></button>
          <button className="stepper-val" onClick={onOpenAmount}>{toFa(value)}{item.unit ? ` ${item.unit}` : ""}</button>
          <button onClick={() => onQuickAdd(1)} aria-label="زیاد کردن"><Plus size={13} /></button>
        </div>
      )}
      {item.type === "time" && (
        <button className="time-chip" onClick={onOpenAmount}><Clock size={12} />{formatMinutes(value)}</button>
      )}
    </li>
  );
});

function TrackerGroupCard({ group, items, trackerLogs, today, onSetLog, onOpenDetail, onAddItem, onEditGroup, onDeleteGroup, onOpenAmount }) {
  const todayKey = dateKey(today.jy, today.jm, today.jd);
  const last7 = useMemo(() => {
    const start = addDaysJalali(today.jy, today.jm, today.jd, -6);
    return Array.from({ length: 7 }, (_, i) => addDaysJalali(start.jy, start.jm, start.jd, i));
  }, [todayKey]); // eslint-disable-line react-hooks/exhaustive-deps

  return (
    <div className="group-card">
      <div className="group-card-head">
        <div className="group-card-titles">
          <h4>{group.title}</h4>
          {group.description && <span className="row-desc">{group.description}</span>}
        </div>
        <IconBtn onClick={() => onEditGroup(group)} label="ویرایش گروه"><Pencil size={14} /></IconBtn>
        <IconBtn onClick={() => onDeleteGroup(group.id)} label="حذف گروه"><Trash2 size={15} /></IconBtn>
      </div>

      {items.length === 0 ? (
        <EmptyState text="موردی در این گروه نیست" sub="یک مورد برای ردیابی اضافه کن" />
      ) : (
        <>
          <ul className="list">
            {items.map((item) => {
              const raw = trackerLogs[`${item.id}:${todayKey}`];
              const value = raw === undefined ? (item.type === "boolean" ? false : 0) : raw;
              return (
                <TrackerItemRow
                  key={item.id} item={item} value={value}
                  onToggleBool={(v) => onSetLog(item.id, todayKey, v)}
                  onQuickAdd={(d) => onSetLog(item.id, todayKey, Math.max(0, value + d))}
                  onOpen={onOpenDetail}
                  onOpenAmount={() => onOpenAmount(item, value)}
                />
              );
            })}
          </ul>

          <div className="group-summary">
            <div className="group-summary-title">نتیجه و خلاصه (۷ روز اخیر)</div>
            {items.map((item) => {
              let text;
              if (item.type === "boolean") {
                const doneCount = last7.filter((d) => trackerLogs[`${item.id}:${dateKey(d.jy, d.jm, d.jd)}`]).length;
                text = `${toFa(doneCount)} از ${toFa(7)} روز`;
              } else {
                const total = last7.reduce((s, d) => s + (trackerLogs[`${item.id}:${dateKey(d.jy, d.jm, d.jd)}`] || 0), 0);
                text = item.type === "time"
                  ? `مجموع ${formatMinutes(total)}`
                  : `مجموع ${toFa(total)}${item.unit ? " " + item.unit : ""} · میانگین ${toFa(Math.round(total / 7))}`;
              }
              return <div key={item.id} className="group-summary-row"><span>{item.title}</span><span className="group-summary-val">{text}</span></div>;
            })}
          </div>
        </>
      )}

      <button className="add-inline-btn" onClick={() => onAddItem(group.id)}><Plus size={15} /> افزودن مورد</button>
    </div>
  );
}

function TrackerTab({ today, trackerGroups, trackerItems, trackerLogs, addGroup, editGroup, deleteGroup, addItem, setLog, openDetail }) {
  const [groupSheetOpen, setGroupSheetOpen] = useState(false);
  const [editingGroup, setEditingGroup] = useState(null);
  const [itemSheetGroupId, setItemSheetGroupId] = useState(null);
  const [amountTarget, setAmountTarget] = useState(null);
  const todayKey = dateKey(today.jy, today.jm, today.jd);

  return (
    <div className="tab-pane">
      {trackerGroups.length === 0 ? (
        <EmptyState text="هنوز گروهی ثبت نشده" sub="یک گروه بساز و موردهایی برای ردیابی اضافه کن" />
      ) : (
        trackerGroups.map((g) => (
          <TrackerGroupCard
            key={g.id} group={g} items={trackerItems.filter((it) => it.groupId === g.id)}
            trackerLogs={trackerLogs} today={today}
            onSetLog={setLog} onOpenDetail={openDetail} onAddItem={setItemSheetGroupId}
            onEditGroup={setEditingGroup} onDeleteGroup={deleteGroup}
            onOpenAmount={(item, value) => setAmountTarget({ item, value })}
          />
        ))
      )}

      <button className="fab" onClick={() => setGroupSheetOpen(true)} aria-label="افزودن گروه"><Plus size={22} /></button>

      <Sheet open={groupSheetOpen} onClose={() => setGroupSheetOpen(false)} title="گروه جدید">
        <GroupForm onSave={(data) => { addGroup({ id: uid(), ...data }); setGroupSheetOpen(false); }} />
      </Sheet>

      <Sheet open={!!editingGroup} onClose={() => setEditingGroup(null)} title="ویرایش گروه">
        {editingGroup && <GroupForm initial={editingGroup} onSave={(data) => { editGroup(editingGroup.id, data); setEditingGroup(null); }} />}
      </Sheet>

      <Sheet open={!!itemSheetGroupId} onClose={() => setItemSheetGroupId(null)} title="مورد جدید">
        <TrackerItemForm onSave={(data) => { addItem({ id: uid(), groupId: itemSheetGroupId, ...data }); setItemSheetGroupId(null); }} />
      </Sheet>

      {amountTarget && amountTarget.item.type === "time" && (
        <DurationSheet
          open={true} onClose={() => setAmountTarget(null)} title={`ثبت زمان — ${amountTarget.item.title}`}
          currentMinutes={amountTarget.value}
          onAdd={(mins) => setLog(amountTarget.item.id, todayKey, amountTarget.value + mins)}
          onSet={(mins) => setLog(amountTarget.item.id, todayKey, mins)}
        />
      )}
      {amountTarget && amountTarget.item.type === "count" && (
        <CountSheet
          open={true} onClose={() => setAmountTarget(null)} title={`ثبت مقدار — ${amountTarget.item.title}`}
          unit={amountTarget.item.unit} currentValue={amountTarget.value}
          onAdd={(v) => setLog(amountTarget.item.id, todayKey, amountTarget.value + v)}
          onSet={(v) => setLog(amountTarget.item.id, todayKey, v)}
        />
      )}
    </div>
  );
}

function ReviewTab({ today, tasks, goals, notes, reviews, saveNote, addReview, deleteReview }) {
  const categories = useContext(CategoriesContext);
  const tKey = dateKey(today.jy, today.jm, today.jd);
  const [noteText, setNoteText] = useState(notes[tKey] || "");
  const [reviewType, setReviewType] = useState("weekly");
  const [strengths, setStrengths] = useState("");
  const [weaknesses, setWeaknesses] = useState("");
  const noteTimer = useRef(null);

  useEffect(() => { setNoteText(notes[tKey] || ""); }, [tKey]); // eslint-disable-line react-hooks/exhaustive-deps

  function handleNoteChange(v) {
    setNoteText(v);
    if (noteTimer.current) clearTimeout(noteTimer.current);
    noteTimer.current = setTimeout(() => saveNote(tKey, v), 500);
  }

  const last7 = useMemo(() => {
    const start = addDaysJalali(today.jy, today.jm, today.jd, -6);
    return Array.from({ length: 7 }, (_, i) => addDaysJalali(start.jy, start.jm, start.jd, i));
  }, [tKey]); // eslint-disable-line react-hooks/exhaustive-deps

  const chartData = last7.map((d) => {
    const dk = dateKey(d.jy, d.jm, d.jd);
    const dayTasks = tasks.filter((t) => t.dateKey === dk);
    const done = dayTasks.filter((t) => t.completed).length;
    const pct = dayTasks.length ? Math.round((done / dayTasks.length) * 100) : 0;
    return { label: PERSIAN_WEEKDAYS_SHORT[persianWeekdayIndex(d.jy, d.jm, d.jd)], value: pct };
  });

  const pieData = categories
    .map((c) => ({ name: c.label, value: goals.filter((g) => g.category === c.id && g.completed).length, fill: (COLOR_PALETTE[c.colorKey] || COLOR_PALETTE.slate).hex }))
    .filter((d) => d.value > 0);

  function periodLabel(r) {
    if (r.type === "monthly") {
      const [jy, jm] = r.periodKey.split("-").map(Number);
      return `${PERSIAN_MONTHS[jm - 1]} ${toFa(jy)}`;
    }
    const [jy, jm, jd] = r.periodKey.split("-").map(Number);
    const end = addDaysJalali(jy, jm, jd, 6);
    return `${toFa(jd)} ${PERSIAN_MONTHS[jm - 1]} تا ${toFa(end.jd)} ${PERSIAN_MONTHS[end.jm - 1]}`;
  }

  function handleAddReview() {
    if (!strengths.trim() && !weaknesses.trim()) return;
    const periodKey = reviewType === "monthly" ? monthKey(today.jy, today.jm) : (() => { const ws = getWeekStart(today.jy, today.jm, today.jd); return dateKey(ws.jy, ws.jm, ws.jd); })();
    addReview({ id: uid(), type: reviewType, periodKey, strengths: strengths.trim(), weaknesses: weaknesses.trim(), createdAtKey: tKey });
    setStrengths(""); setWeaknesses("");
  }

  return (
    <div className="tab-pane">
      <section className="section">
        <div className="section-head"><h3>روند ۷ روز اخیر</h3></div>
        <div className="chart-box">
          <SimpleBarChart data={chartData} height={140} />
        </div>
      </section>

      {pieData.length > 0 && (
        <section className="section">
          <div className="section-head"><h3>اهداف تکمیل‌شده به تفکیک دسته</h3></div>
          <div className="chart-box chart-box-row">
            <SimpleDonutChart data={pieData} size={110} />
            <ul className="legend">
              {pieData.map((d, i) => (
                <li key={i} className="legend-row"><span className="legend-dot" style={{ background: d.fill }} />{d.name}<span className="legend-val">{toFa(d.value)}</span></li>
              ))}
            </ul>
          </div>
        </section>
      )}

      <section className="section">
        <div className="section-head"><h3>یادداشت امروز</h3></div>
        <textarea className="note-area" placeholder="چیزی که امروز به ذهنت رسید را بنویس…" value={noteText} onChange={(e) => handleNoteChange(e.target.value)} />
      </section>

      <section className="section">
        <div className="section-head"><h3>مرور و جمع‌بندی</h3></div>
        <div className="segmented">
          <button className={reviewType === "weekly" ? "seg-active" : ""} onClick={() => setReviewType("weekly")}>این هفته</button>
          <button className={reviewType === "monthly" ? "seg-active" : ""} onClick={() => setReviewType("monthly")}>این ماه</button>
        </div>
        <label className="field-label"><TrendingUp size={13} style={{ verticalAlign: "-2px" }} /> نقاط قوت</label>
        <textarea className="note-area note-area-sm" placeholder="چه چیزی خوب پیش رفت؟" value={strengths} onChange={(e) => setStrengths(e.target.value)} />
        <label className="field-label">نقاط ضعف</label>
        <textarea className="note-area note-area-sm" placeholder="چه چیزی نیاز به بهبود دارد؟" value={weaknesses} onChange={(e) => setWeaknesses(e.target.value)} />
        <button className="primary-btn" onClick={handleAddReview} disabled={!strengths.trim() && !weaknesses.trim()}>ثبت مرور</button>

        {reviews.length > 0 && (
          <ul className="review-list">
            {[...reviews].reverse().map((r) => (
              <li key={r.id} className="review-card">
                <div className="review-card-head">
                  <span className="review-period">{r.type === "monthly" ? "ماهانه" : "هفتگی"} · {periodLabel(r)}</span>
                  <IconBtn onClick={() => deleteReview(r.id)} label="حذف"><Trash2 size={14} /></IconBtn>
                </div>
                {r.strengths && <p className="review-text"><b>قوت:</b> {r.strengths}</p>}
                {r.weaknesses && <p className="review-text"><b>ضعف:</b> {r.weaknesses}</p>}
              </li>
            ))}
          </ul>
        )}
      </section>
    </div>
  );
}

  .cat-manage-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  .cat-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .cat-manage-label { flex: 1; font-size: 13px; font-weight: 600; }
  .swatch-row { display: flex; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .swatch-active { border-color: var(--c-ink); }

  .group-card-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

  .stepper { display: flex; align-items: center; gap: 6px; background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 999px; padding: 3px 6px; flex-shrink: 0; }
  .stepper button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--c-border); background: #fff; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--c-ink-soft); }
  .stepper-val { width: auto !important; min-width: 44px; border: none !important; background: none !important; font-size: 11.5px; font-weight: 700; color: var(--c-ink) !important; white-space: nowrap; padding: 0 4px !important; border-radius: 6px !important; }
  .time-chip { display: flex; align-items: center; gap: 4px; background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 999px; padding: 6px 10px; font-size: 11.5px; font-weight: 700; color: var(--c-ink); white-space: nowrap; flex-shrink: 0; }
  .group-summary { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--c-border); display: flex; flex-direction: column; gap: 5px; }
  .group-summary-title { font-size: 11px; font-weight: 700; color: var(--c-ink-soft); margin-bottom: 2px; }
  .group-summary-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; gap: 8px; }
  .group-summary-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-summary-val { font-weight: 700; color: var(--c-primary); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { .app-root * { transition: none !important; } }
`;
/* =========================================================================
   ROOT APP
   ========================================================================= */

function PlanningApp() {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [goals, setGoals] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [habits, setHabits] = useState([]);
  const [notes, setNotes] = useState({});
  const [reviews, setReviews] = useState([]);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [trackerGroups, setTrackerGroups] = useState([]);
  const [trackerItems, setTrackerItems] = useState([]);
  const [trackerLogs, setTrackerLogs] = useState({});
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [detail, setDetail] = useState(null);   // { kind, id }
  const [editing, setEditing] = useState(null); // { kind, item }
  const [toast, setToast] = useState(null);
  const today = useMemo(() => todayJalali(), []);
  const didAutoRoll = useRef(false);

  const todayKey = dateKey(today.jy, today.jm, today.jd);
  const curMonthKey = monthKey(today.jy, today.jm);
  const curWeekStart = getWeekStart(today.jy, today.jm, today.jd);
  const curWeekKey = dateKey(curWeekStart.jy, curWeekStart.jm, curWeekStart.jd);

  useEffect(() => {
    const d = loadAll();
    if (d.goals) setGoals(d.goals);
    if (d.tasks) setTasks(d.tasks);
    if (d.habits) setHabits(d.habits);
    if (d.notes) setNotes(d.notes);
    if (d.reviews) setReviews(d.reviews);
    if (d.categories) setCategories(d.categories);
    if (d.trackerGroups) setTrackerGroups(d.trackerGroups);
    if (d.trackerItems) setTrackerItems(d.trackerItems);
    if (d.trackerLogs) setTrackerLogs(d.trackerLogs);
    if (d.settings) setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
    setLoaded(true);
  }, []);

  const openDetail = useCallback((d) => setDetail(d), []);
  const closeDetail = useCallback(() => setDetail(null), []);

  /* ---- goals ---- */
  const addGoal = useCallback((goal) => setGoals((prev) => { const next = [...prev, goal]; persist("goals", next); return next; }), []);
  const toggleGoal = useCallback((id) => setGoals((prev) => {
    const next = prev.map((g) => g.id === id ? { ...g, completed: !g.completed } : g);
    persist("goals", next); return next;
  }), []);
  const updateGoal = useCallback((id, data) => setGoals((prev) => {
    const next = prev.map((g) => {
      if (g.id !== id) return g;
      const merged = { ...g, ...data };
      // A goal that stops being measurable loses its auto-completion rule.
      if (isMeasurable(merged)) merged.completed = goalProgress(merged) >= merged.targetValue;
      return merged;
    });
    persist("goals", next); return next;
  }), []);
  const deleteGoal = useCallback((id) => setGoals((prev) => { const next = prev.filter((g) => g.id !== id); persist("goals", next); return next; }), []);
  const logGoalProgress = useCallback((id, dk, delta) => setGoals((prev) => {
    const next = prev.map((g) => {
      if (g.id !== id) return g;
      const progressLog = { ...(g.progressLog || {}) };
      progressLog[dk] = (progressLog[dk] || 0) + delta;
      if (progressLog[dk] <= 0) delete progressLog[dk];
      const merged = { ...g, progressLog };
      merged.completed = goalProgress(merged) >= (merged.targetValue || Infinity);
      return merged;
    });
    persist("goals", next); return next;
  }), []);
  const clearGoalLogEntry = useCallback((id, dk) => setGoals((prev) => {
    const next = prev.map((g) => {
      if (g.id !== id) return g;
      const progressLog = { ...(g.progressLog || {}) };
      delete progressLog[dk];
      const merged = { ...g, progressLog };
      merged.completed = goalProgress(merged) >= (merged.targetValue || Infinity);
      return merged;
    });
    persist("goals", next); return next;
  }), []);

  /* ---- tasks ---- */
  const addTask = useCallback((task) => {
    if (task.reminderTime) requestNotifyPermission();
    setTasks((prev) => { const next = [...prev, task]; persist("tasks", next); return next; });
  }, []);
  const toggleTask = useCallback((id) => setTasks((prev) => { const next = prev.map((t) => t.id === id ? { ...t, completed: !t.completed } : t); persist("tasks", next); return next; }), []);
  const updateTask = useCallback((id, data) => setTasks((prev) => {
    const next = prev.map((t) => t.id === id ? { ...t, ...data, reminderFired: data.reminderTime !== t.reminderTime ? false : t.reminderFired } : t);
    persist("tasks", next); return next;
  }), []);
  const deleteTask = useCallback((id) => setTasks((prev) => { const next = prev.filter((t) => t.id !== id); persist("tasks", next); return next; }), []);

  /* ---- habits ---- */
  const addHabit = useCallback((habit) => setHabits((prev) => { const next = [...prev, habit]; persist("habits", next); return next; }), []);
  const toggleHabit = useCallback((id, dk) => setHabits((prev) => {
    const next = prev.map((h) => {
      if (h.id !== id) return h;
      const completions = { ...h.completions };
      if (completions[dk]) delete completions[dk]; else completions[dk] = true;
      return { ...h, completions };
    });
    persist("habits", next); return next;
  }), []);
  const updateHabit = useCallback((id, data) => setHabits((prev) => { const next = prev.map((h) => h.id === id ? { ...h, ...data } : h); persist("habits", next); return next; }), []);
  const deleteHabit = useCallback((id) => setHabits((prev) => { const next = prev.filter((h) => h.id !== id); persist("habits", next); return next; }), []);

  /* ---- notes / reviews ---- */
  const saveNote = useCallback((dk, text) => setNotes((prev) => { const next = { ...prev, [dk]: text }; persist("notes", next); return next; }), []);
  const addReview = useCallback((review) => setReviews((prev) => { const next = [...prev, review]; persist("reviews", next); return next; }), []);
  const deleteReview = useCallback((id) => setReviews((prev) => { const next = prev.filter((r) => r.id !== id); persist("reviews", next); return next; }), []);

  /* ---- categories & settings ---- */
  const addCategory = useCallback((cat) => setCategories((prev) => { const next = [...prev, cat]; persist("categories", next); return next; }), []);
  const deleteCategory = useCallback((id) => {
    setCategories((prev) => {
      if (prev.length <= 1) return prev;
      const next = prev.filter((c) => c.id !== id);
      const fallback = next[0].id;
      persist("categories", next);
      setGoals((pg) => { const ng = pg.map((g) => g.category === id ? { ...g, category: fallback } : g); persist("goals", ng); return ng; });
      setTasks((pt) => { const nt = pt.map((t) => t.category === id ? { ...t, category: fallback } : t); persist("tasks", nt); return nt; });
      setHabits((ph) => { const nh = ph.map((h) => h.category === id ? { ...h, category: fallback } : h); persist("habits", nh); return nh; });
      return next;
    });
  }, []);
  const updateSettings = useCallback((patch) => setSettings((prev) => { const next = { ...prev, ...patch }; persist("settings", next); return next; }), []);

  /* ---- tracker ---- */
  const addTrackerGroup = useCallback((group) => setTrackerGroups((prev) => { const next = [...prev, group]; persist("trackerGroups", next); return next; }), []);
  const editTrackerGroup = useCallback((id, data) => setTrackerGroups((prev) => { const next = prev.map((g) => g.id === id ? { ...g, ...data } : g); persist("trackerGroups", next); return next; }), []);
  const deleteTrackerGroup = useCallback((id) => {
    setTrackerGroups((prev) => { const next = prev.filter((g) => g.id !== id); persist("trackerGroups", next); return next; });
    setTrackerItems((prev) => { const next = prev.filter((it) => it.groupId !== id); persist("trackerItems", next); return next; });
  }, []);
  const addTrackerItem = useCallback((item) => setTrackerItems((prev) => { const next = [...prev, item]; persist("trackerItems", next); return next; }), []);
  const updateTrackerItem = useCallback((id, data) => setTrackerItems((prev) => { const next = prev.map((it) => it.id === id ? { ...it, ...data } : it); persist("trackerItems", next); return next; }), []);
  const deleteTrackerItem = useCallback((id) => setTrackerItems((prev) => { const next = prev.filter((it) => it.id !== id); persist("trackerItems", next); return next; }), []);
  const setTrackerLog = useCallback((itemId, dk, value) => {
    setTrackerLogs((prev) => { const next = { ...prev, [`${itemId}:${dk}`]: value }; persist("trackerLogs", next); return next; });
  }, []);

  /* ---- rollover ---- */
  const overdueTasks = useMemo(() => findOverdueTasks(tasks, todayKey), [tasks, todayKey]);
  const overdueGoals = useMemo(() => findOverdueGoals(goals, curMonthKey, curWeekKey), [goals, curMonthKey, curWeekKey]);

  const rolloverTasks = useCallback(() => {
    setTasks((prev) => {
      const next = prev.map((t) => (!t.completed && t.dateKey < todayKey)
        ? { ...t, dateKey: todayKey, reminderFired: false, rolloverCount: (t.rolloverCount || 0) + 1 }
        : t);
      persist("tasks", next); return next;
    });
  }, [todayKey]);

  const rolloverGoals = useCallback(() => {
    setGoals((prev) => {
      const next = prev.map((g) => {
        if (g.completed) return g;
        if (g.type === "monthly" && g.monthKey && g.monthKey < curMonthKey) {
          return { ...g, monthKey: curMonthKey, rolloverCount: (g.rolloverCount || 0) + 1 };
        }
        if (g.type === "weekly" && g.weekKey && g.weekKey < curWeekKey) {
          return { ...g, weekKey: curWeekKey, rolloverCount: (g.rolloverCount || 0) + 1 };
        }
        return g;
      });
      persist("goals", next); return next;
    });
  }, [curMonthKey, curWeekKey]);

  useEffect(() => {
    if (!loaded || didAutoRoll.current || !settings.autoRollover) return;
    didAutoRoll.current = true;
    if (findOverdueTasks(tasks, todayKey).length) rolloverTasks();
    if (findOverdueGoals(goals, curMonthKey, curWeekKey).length) rolloverGoals();
  }, [loaded, settings.autoRollover]); // eslint-disable-line react-hooks/exhaustive-deps

  /* ---- reminder polling ---- */
  useEffect(() => {
    const interval = setInterval(() => {
      const now = new Date();
      const nowKey = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      setTasks((prev) => {
        let changed = false;
        const next = prev.map((t) => {
          if (t.dateKey === todayKey && t.reminderTime && !t.completed && !t.reminderFired && t.reminderTime <= nowKey) {
            changed = true;
            playBeep();
            fireBrowserNotification("یادآوری: " + t.title, "زمان انجام این کار رسیده");
            setToast({ id: t.id, title: t.title });
            return { ...t, reminderFired: true };
          }
          return t;
        });
        if (changed) persist("tasks", next);
        return changed ? next : prev;
      });
    }, 20000);
    return () => clearInterval(interval);
  }, [todayKey]);

  const allActiveGoals = useMemo(() => goals.filter((g) => !g.completed), [goals]);

  /* ---- detail + edit routing ---- */
  const detailItem = useMemo(() => {
    if (!detail) return null;
    if (detail.kind === "goal") return goals.find((g) => g.id === detail.id) || null;
    if (detail.kind === "task") return tasks.find((t) => t.id === detail.id) || null;
    if (detail.kind === "habit") return habits.find((h) => h.id === detail.id) || null;
    if (detail.kind === "tracker") return trackerItems.find((it) => it.id === detail.id) || null;
    return null;
  }, [detail, goals, tasks, habits, trackerItems]);

  const DETAIL_TITLES = { goal: "جزئیات هدف", task: "جزئیات کار", habit: "جزئیات عادت", tracker: "جزئیات مورد" };
  const EDIT_TITLES = { goal: "ویرایش هدف", task: "ویرایش کار", habit: "ویرایش عادت", tracker: "ویرایش مورد" };

  function startEdit() {
    setEditing({ kind: detail.kind, item: detailItem });
    setDetail(null);
  }
  function confirmDelete() {
    const k = detail.kind, id = detail.id;
    setDetail(null);
    if (k === "goal") deleteGoal(id);
    else if (k === "task") deleteTask(id);
    else if (k === "habit") deleteHabit(id);
    else if (k === "tracker") deleteTrackerItem(id);
  }
  function saveEdit(data) {
    const { kind, item } = editing;
    if (kind === "goal") updateGoal(item.id, data);
    else if (kind === "task") updateTask(item.id, data);
    else if (kind === "habit") updateHabit(item.id, data);
    else if (kind === "tracker") updateTrackerItem(item.id, data);
    setEditing(null);
  }

  return (
    <CategoriesContext.Provider value={categories}>
      <div dir="rtl" className="app-root">
        <style>{APP_CSS}</style>

        <Toast toast={toast} onClose={() => setToast(null)} />

        <header className="app-header">
          <div className="app-header-top">
            <span className="app-wordmark">گاه‌نما</span>
            <div className="header-right-group">
              <span className="app-header-date">{PERSIAN_WEEKDAYS[persianWeekdayIndex(today.jy, today.jm, today.jd)]}، {toFa(today.jd)} {PERSIAN_MONTHS[today.jm - 1]} {toFa(today.jy)}</span>
              <IconBtn onClick={() => setSettingsOpen(true)} label="تنظیمات"><Settings size={16} /></IconBtn>
            </div>
          </div>
          <SeasonRing jy={today.jy} jm={today.jm} jd={today.jd} />
        </header>

        {!loaded ? (
          <div className="tab-pane"><EmptyState text="در حال بارگذاری…" /></div>
        ) : (
          <>
            {tab === "dashboard" && (
              <DashboardTab today={today} goals={goals} tasks={tasks} habits={habits}
                toggleTask={toggleTask} toggleHabit={toggleHabit} setTab={setTab} openDetail={openDetail}
                overdueTasks={overdueTasks} overdueGoals={overdueGoals}
                rolloverTasks={rolloverTasks} rolloverGoals={rolloverGoals} />
            )}
            {tab === "goals" && (
              <GoalsTab today={today} goals={goals} addGoal={addGoal} toggleGoal={toggleGoal} openDetail={openDetail}
                overdueGoals={overdueGoals} rolloverGoals={rolloverGoals} />
            )}
            {tab === "tasks" && (
              <TasksTab today={today} tasks={tasks} goals={allActiveGoals} addTask={addTask} toggleTask={toggleTask}
                openDetail={openDetail} overdueTasks={overdueTasks} rolloverTasks={rolloverTasks} />
            )}
            {tab === "habits" && (
              <HabitsTab today={today} habits={habits} addHabit={addHabit} toggleHabit={toggleHabit} openDetail={openDetail} />
            )}
            {tab === "tracker" && (
              <TrackerTab today={today} trackerGroups={trackerGroups} trackerItems={trackerItems} trackerLogs={trackerLogs}
                addGroup={addTrackerGroup} editGroup={editTrackerGroup} deleteGroup={deleteTrackerGroup}
                addItem={addTrackerItem} setLog={setTrackerLog} openDetail={openDetail} />
            )}
            {tab === "review" && (
              <ReviewTab today={today} tasks={tasks} goals={goals} notes={notes} reviews={reviews}
                saveNote={saveNote} addReview={addReview} deleteReview={deleteReview} />
            )}
          </>
        )}

        <BottomNav tab={tab} setTab={setTab} />

        <SettingsSheet open={settingsOpen} onClose={() => setSettingsOpen(false)}
          categories={categories} addCategory={addCategory} deleteCategory={deleteCategory}
          settings={settings} updateSettings={updateSettings} />

        <Sheet open={!!detailItem} onClose={closeDetail} title={detail ? DETAIL_TITLES[detail.kind] : ""}>
          {detailItem && (
            <>
              <h3 className="detail-title">{detailItem.title}</h3>
              {detail.kind === "goal" && (
                <GoalDetail goal={detailItem} goals={goals} today={today}
                  onEdit={startEdit} onDelete={confirmDelete} onToggle={toggleGoal}
                  onLogProgress={logGoalProgress} onClearLogEntry={clearGoalLogEntry} />
              )}
              {detail.kind === "task" && (
                <TaskDetail task={detailItem} goals={goals} onEdit={startEdit} onDelete={confirmDelete} onToggle={toggleTask} />
              )}
              {detail.kind === "habit" && (
                <HabitDetail habit={detailItem} today={today} onEdit={startEdit} onDelete={confirmDelete} onToggle={toggleHabit} />
              )}
              {detail.kind === "tracker" && (
                <TrackerItemDetail item={detailItem} trackerLogs={trackerLogs} today={today}
                  onEdit={startEdit} onDelete={confirmDelete} onSetLog={setTrackerLog} />
              )}
            </>
          )}
        </Sheet>

        <Sheet open={!!editing} onClose={() => setEditing(null)} title={editing ? EDIT_TITLES[editing.kind] : ""}>
          {editing && editing.kind === "goal" && (
            <GoalForm initial={editing.item} monthlyGoals={editing.item.type === "weekly" ? goals.filter((g) => g.type === "monthly") : null} onSave={saveEdit} />
          )}
          {editing && editing.kind === "task" && <TaskForm initial={editing.item} goals={allActiveGoals} onSave={saveEdit} />}
          {editing && editing.kind === "habit" && <HabitForm initial={editing.item} onSave={saveEdit} />}
          {editing && editing.kind === "tracker" && <TrackerItemForm initial={editing.item} onSave={saveEdit} />}
        </Sheet>
      </div>
    </CategoriesContext.Provider>
  );
}

if (ReactDOM.createRoot) {
  ReactDOM.createRoot(document.getElementById("root")).render(<PlanningApp />);
} else {
  ReactDOM.render(<PlanningApp />, document.getElementById("root"));
}

</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
