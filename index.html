/* =========================================================================
   CHARTS — small dependency-free SVG chart components (no recharts).
   ========================================================================= */

function SimpleBarChart({ data, height = 140 }) {
  const vbW = 300;
  const slot = vbW / data.length;
  const barW = slot * 0.5;
  const top = 10, bottom = 22;
  const usable = height - top - bottom;
  return (
    <svg viewBox={`0 0 ${vbW} ${height}`} width="100%" height={height} preserveAspectRatio="none" role="img" aria-label="نمودار روند هفتگی">
      <line x1="0" y1={height - bottom} x2={vbW} y2={height - bottom} stroke="var(--c-border-soft)" strokeWidth="1" />
      {data.map((d, i) => {
        const h = Math.max(2, (d.value / 100) * usable);
        const x = i * slot + (slot - barW) / 2;
        const y = height - bottom - h;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={h} rx="4" fill="var(--c-primary)" />
            <text x={i * slot + slot / 2} y={height - 8} fontSize="9" fill="var(--c-ink-soft)" textAnchor="middle">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function SimpleDonutChart({ data, size = 120 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) return null;
  const r = size * 0.34;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const arcs = data.map((d, i) => {
    const frac = d.value / total;
    const dash = Math.max(0, frac * circumference - 1.5);
    const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.fill} strokeWidth={size * 0.17} strokeDasharray={`${dash} ${circumference - dash}`} strokeDashoffset={-offset} strokeLinecap="round" />;
    offset += frac * circumference;
    return el;
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label="نمودار دسته‌بندی">
      <g transform={`rotate(-90 ${cx} ${cy})`}>{arcs}</g>
    </svg>
  );
}

/* =========================================================================
   JALALI (SHAMSI) CALENDAR — verified conversion (33-year break-cycle rule
   for Jalali leap years + standard Fliegel & Van Flandern JDN algorithm).
   This section is unchanged from the tested version — do not alter without
   re-running the reference-date + round-trip test suite.
   ========================================================================= */

function div(a, b) { return Math.floor(a / b); }
function mod(a, b) { return a - Math.floor(a / b) * b; }

function gregorianToJDN(y, m, d) {
  const a = div(14 - m, 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + div(153 * mm + 2, 5) + 365 * yy + div(yy, 4) - div(yy, 100) + div(yy, 400) - 32045;
}
function jdnToGregorian(jdn) {
  const a = jdn + 32044;
  const b = div(4 * a + 3, 146097);
  const c = a - div(146097 * b, 4);
  const d = div(4 * c + 3, 1461);
  const e = c - div(1461 * d, 4);
  const m = div(5 * e + 2, 153);
  const day = e - div(153 * m + 2, 5) + 1;
  const month = m + 3 - 12 * div(m, 10);
  const year = 100 * b + d - 4800 + div(m, 10);
  return { gy: year, gm: month, gd: day };
}

const JALALI_BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

function jalCal(jy) {
  const bl = JALALI_BREAKS.length;
  const gy = jy + 621;
  let leapJ = -14;
  let jp = JALALI_BREAKS[0];
  let jump = 0, jm, i;
  for (i = 1; i < bl; i += 1) {
    jm = JALALI_BREAKS[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
    jp = jm;
  }
  let n = jy - jp;
  leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
  let leap = mod(mod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap, gy, march };
}
function isLeapJalaliYear(jy) { return jalCal(jy).leap === 0; }
function monthOffset(jm) { return (jm - 1) * 31 - div(jm, 7) * (jm - 7); }

function jalaliToGregorian(jy, jm, jd) {
  const r = jalCal(jy);
  const jdn = gregorianToJDN(r.gy, 3, r.march) + monthOffset(jm) + jd - 1;
  return jdnToGregorian(jdn);
}
function gregorianToJalali(gy, gm, gd) {
  const jdn = gregorianToJDN(gy, gm, gd);
  let jy = gy - 621;
  let r = jalCal(jy);
  let jdn1f = gregorianToJDN(r.gy, 3, r.march);
  if (jdn < jdn1f) {
    jy -= 1;
    r = jalCal(jy);
    jdn1f = gregorianToJDN(r.gy, 3, r.march);
  }
  let k = jdn - jdn1f, jm, jd;
  if (k <= 185) { jm = 1 + div(k, 31); jd = mod(k, 31) + 1; }
  else { k -= 186; jm = 7 + div(k, 30); jd = mod(k, 30) + 1; }
  return { jy, jm, jd };
}
function jalaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalaliYear(jy) ? 30 : 29;
}
function addDaysJalali(jy, jm, jd, days) {
  const g = jalaliToGregorian(jy, jm, jd);
  const jdn = gregorianToJDN(g.gy, g.gm, g.gd) + days;
  const g2 = jdnToGregorian(jdn);
  return gregorianToJalali(g2.gy, g2.gm, g2.gd);
}
function addMonthsJalali(jy, jm, delta) {
  let total = (jy * 12 + (jm - 1)) + delta;
  const ny = div(total, 12);
  const nm = mod(total, 12) + 1;
  return { jy: ny, jm: nm };
}
function persianWeekdayIndex(jy, jm, jd) {
  const g = jalaliToGregorian(jy, jm, jd);
  const jsDay = new Date(g.gy, g.gm - 1, g.gd).getDay(); // 0=Sun..6=Sat
  return (jsDay + 1) % 7; // 0=Sat..6=Fri
}
function getWeekStart(jy, jm, jd) {
  const idx = persianWeekdayIndex(jy, jm, jd);
  return addDaysJalali(jy, jm, jd, -idx);
}
function todayJalali() {
  const t = new Date();
  return gregorianToJalali(t.getFullYear(), t.getMonth() + 1, t.getDate());
}
function dateKey(jy, jm, jd) {
  return `${jy}-${String(jm).padStart(2, "0")}-${String(jd).padStart(2, "0")}`;
}
function monthKey(jy, jm) { return `${jy}-${String(jm).padStart(2, "0")}`; }
function sameDate(a, b) { return a.jy === b.jy && a.jm === b.jm && a.jd === b.jd; }

const STORAGE_KEYS = ["goals", "tasks", "habits", "notes", "reviews", "categories",
  "trackerGroups", "trackerItems", "trackerLogs", "trackerEntries", "settings"];

const LS_PREFIX = "gahnama:";
function loadAll() {
  const out = {};
  for (const k of STORAGE_KEYS) {
    try {
      const raw = localStorage.getItem(LS_PREFIX + k);
      out[k] = raw ? JSON.parse(raw) : null;
    } catch (e) {
      out[k] = null;
    }
  }
  return out;
}
function persist(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); }
  catch (e) { console.error("storage error", key, e); }
}

/* =========================================================================
   GOALS
   A goal is "simple" (manual checkbox) or measurable by count or time.
   Measurable goals hold dated entries, each with an optional note.

   A weekly goal linked to a monthly goal FEEDS it: the monthly total is its
   own entries plus every linked weekly entry. The total is derived rather
   than copied, so editing or deleting a weekly entry updates the monthly
   goal automatically and the two can never drift apart. Only same-unit
   links contribute — pouring "pages" into an "hours" goal would be wrong.
   ========================================================================= */

function isMeasurable(goal) { return goal.targetType === "count" || goal.targetType === "time"; }

function migrateGoal(g) {
  if (Array.isArray(g.progressEntries)) return g;
  const entries = [];
  if (g.progressLog && typeof g.progressLog === "object") {
    for (const dk of Object.keys(g.progressLog).sort()) {
      const v = g.progressLog[dk];
      if (v) entries.push({ id: `mig_${dk}_${Math.random().toString(36).slice(2, 7)}`, dateKey: dk, value: v, note: null });
    }
  }
  const out = { ...g, progressEntries: entries };
  delete out.progressLog;
  return out;
}

function goalOwnProgress(goal) {
  const entries = goal.progressEntries;
  if (!Array.isArray(entries)) return 0;
  let sum = 0;
  for (const e of entries) sum += e.value || 0;
  return sum;
}
function linkedEntriesFor(goal, goals) {
  if (!goal || goal.type !== "monthly" || !isMeasurable(goal)) return [];
  const out = [];
  for (const g of goals) {
    if (g.id === goal.id || g.linkedMonthlyId !== goal.id) continue;
    if (g.targetType !== goal.targetType) continue; // different unit — don't mix
    for (const e of (g.progressEntries || [])) out.push({ ...e, sourceId: g.id, sourceTitle: g.title });
  }
  return out;
}
function goalTotal(goal, goals) {
  let sum = goalOwnProgress(goal);
  for (const e of linkedEntriesFor(goal, goals)) sum += e.value || 0;
  return sum;
}
function progressTextFor(goal, total) {
  const t = goal.targetValue || 0;
  if (goal.targetType === "time") return `${formatMinutes(total)} از ${formatMinutes(t)}`;
  return `${toFa(total)} از ${toFa(t)}${goal.unit ? " " + goal.unit : ""}`;
}
function progressPctFor(goal, total) {
  const t = goal.targetValue || 0;
  if (!t) return 0;
  return Math.min(100, (total / t) * 100);
}
function formatAmount(type, value, unit) {
  if (type === "time") return formatMinutes(value);
  return `${toFa(value)}${unit ? " " + unit : ""}`;
}
/* Re-derives completion for every measurable goal. Run after ANY change to
   the goals array, because one weekly edit can complete a monthly parent. */
function recomputeGoals(goals) {
  return goals.map((g) => isMeasurable(g)
    ? { ...g, completed: goalTotal(g, goals) >= (g.targetValue || Infinity) }
    : g);
}

/* =========================================================================
   HABITS
   A habit is either simple (done / not done) or measured by count or time
   with optional daily minimum and maximum. It can also carry a weekly
   target expressed in successful days.

   Note the asymmetry: for a limit-style habit (max only), a day with no
   record counts as zero and therefore as a success — not logging cigarettes
   means you smoked none. For a minimum, no record means you fell short.
   ========================================================================= */

function migrateHabit(h) {
  if (h.entries && !h.completions) return h;
  const entries = { ...(h.entries || {}) };
  if (h.completions) for (const k in h.completions) if (h.completions[k]) entries[k] = entries[k] === undefined ? true : entries[k];
  const out = {
    metric: "simple", unit: null, dailyMin: null, dailyMax: null, weeklyMin: null, weeklyMax: null,
    ...h, entries,
  };
  delete out.completions;
  return out;
}
function habitMeasured(habit) { return habit.metric === "count" || habit.metric === "time"; }
function habitDayValue(habit, dk) {
  const v = (habit.entries || {})[dk];
  if (v === undefined || v === null) return habitMeasured(habit) ? 0 : false;
  return v;
}
function habitDaySuccess(habit, dk) {
  const raw = (habit.entries || {})[dk];
  if (!habitMeasured(habit)) return !!raw;
  const v = (raw === undefined || raw === null) ? 0 : raw;
  const hasMin = habit.dailyMin !== null && habit.dailyMin !== undefined;
  const hasMax = habit.dailyMax !== null && habit.dailyMax !== undefined;
  if (!hasMin && !hasMax) return v > 0;
  if (hasMin && v < habit.dailyMin) return false;
  if (hasMax && v > habit.dailyMax) return false;
  return true;
}
function habitStreak(habit, today) {
  let streak = 0;
  let cur = today;
  // Today counts only once it already qualifies, so an unfinished day
  // doesn't look like a broken streak first thing in the morning.
  while (habitDaySuccess(habit, dateKey(cur.jy, cur.jm, cur.jd))) {
    streak += 1;
    cur = addDaysJalali(cur.jy, cur.jm, cur.jd, -1);
  }
  return streak;
}
function habitWeekDays(habit, today) {
  const ws = getWeekStart(today.jy, today.jm, today.jd);
  const todayKey = dateKey(today.jy, today.jm, today.jd);
  let days = 0, elapsed = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDaysJalali(ws.jy, ws.jm, ws.jd, i);
    const dk = dateKey(d.jy, d.jm, d.jd);
    if (dk > todayKey) break; // don't credit days that haven't happened
    elapsed += 1;
    if (habitDaySuccess(habit, dk)) days += 1;
  }
  return { days, elapsed };
}
function habitTargetText(habit) {
  const parts = [];
  const unit = habit.metric === "time" ? null : habit.unit;
  const fmt = (v) => habit.metric === "time" ? formatMinutes(v) : `${toFa(v)}${unit ? " " + unit : ""}`;
  if (habit.dailyMin != null && habit.dailyMax != null) parts.push(`روزانه بین ${fmt(habit.dailyMin)} و ${fmt(habit.dailyMax)}`);
  else if (habit.dailyMin != null) parts.push(`روزانه حداقل ${fmt(habit.dailyMin)}`);
  else if (habit.dailyMax != null) parts.push(`روزانه حداکثر ${fmt(habit.dailyMax)}`);
  if (habit.weeklyMin != null && habit.weeklyMax != null) parts.push(`هفته‌ای بین ${toFa(habit.weeklyMin)} و ${toFa(habit.weeklyMax)} روز`);
  else if (habit.weeklyMin != null) parts.push(`هفته‌ای حداقل ${toFa(habit.weeklyMin)} روز`);
  else if (habit.weeklyMax != null) parts.push(`هفته‌ای حداکثر ${toFa(habit.weeklyMax)} روز`);
  return parts.join(" · ");
}

/* =========================================================================
   TRACKER
   Groups are recorded either per day or per month; the group's period
   decides the key format ("1405-05-13" vs "1405-05"). Each record is its
   own entry, so several can share a period and each keeps its own note.
   Items and groups can be archived: hidden from the list, data preserved.
   ========================================================================= */

function migrateTrackerEntries(existing, oldLogs) {
  if (Array.isArray(existing)) return existing;
  const out = [];
  for (const k in (oldLogs || {})) {
    const i = k.indexOf(":");
    if (i < 0) continue;
    const itemId = k.slice(0, i);
    const periodKey = k.slice(i + 1);
    const raw = oldLogs[k];
    const value = (raw && typeof raw === "object") ? raw.value : raw;
    const note = (raw && typeof raw === "object") ? (raw.note || null) : null;
    const empty = value === false || value === 0 || value === undefined || value === null;
    if (empty && !note) continue;
    out.push({ id: `mig_${itemId}_${periodKey}`, itemId, periodKey, value, note });
  }
  return out;
}
function entriesForPeriod(entries, itemId, periodKey) {
  return entries.filter((e) => e.itemId === itemId && e.periodKey === periodKey);
}
function periodTotal(entries, item, periodKey) {
  const list = entriesForPeriod(entries, itemId_(item), periodKey);
  if (item.type === "boolean") return list.some((e) => e.value === true);
  let s = 0;
  for (const e of list) s += e.value || 0;
  return s;
}
function itemId_(item) { return typeof item === "string" ? item : item.id; }
function periodHasEntry(entries, item, periodKey) {
  const list = entriesForPeriod(entries, itemId_(item), periodKey);
  if (!list.length) return false;
  if (item.type === "boolean") return list.some((e) => e.value === true);
  return list.some((e) => (e.value || 0) !== 0 || e.note);
}
function groupPeriodKey(group, cursor) {
  return group.period === "monthly"
    ? monthKey(cursor.jy, cursor.jm)
    : dateKey(cursor.jy, cursor.jm, cursor.jd);
}
function formatPeriodKey(periodKey) {
  const parts = periodKey.split("-");
  if (parts.length === 2) return `${PERSIAN_MONTHS[Number(parts[1]) - 1]} ${toFa(Number(parts[0]))}`;
  return `${toFa(Number(parts[2]))} ${PERSIAN_MONTHS[Number(parts[1]) - 1]}`;
}

/* =========================================================================
   ROLLOVER — carrying unfinished items forward. Zero-padded keys make plain
   "<" a valid chronological test.
   ========================================================================= */

function findOverdueTasks(tasks, todayKey) {
  return tasks.filter((t) => !t.completed && t.dateKey < todayKey);
}
function findOverdueGoals(goals, curMonthKey, curWeekKey) {
  return goals.filter((g) => {
    if (g.completed) return false;
    if (g.type === "monthly") return g.monthKey && g.monthKey < curMonthKey;
    if (g.type === "weekly") return g.weekKey && g.weekKey < curWeekKey;
    return false;
  });
}

/* =========================================================================
   REMINDERS — best-effort while the app is open.
   ========================================================================= */

function requestNotifyPermission() {
  try {
    if (typeof Notification === "undefined") return;
    if (Notification.permission === "default") Notification.requestPermission().catch(() => {});
  } catch (e) { /* unavailable */ }
}
function fireBrowserNotification(title, body) {
  try {
    if (typeof Notification === "undefined") return;
    if (Notification.permission === "granted") new Notification(title, { body });
  } catch (e) { /* ignore */ }
}
function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
    osc.stop(ctx.currentTime + 0.6);
  } catch (e) { /* ignore */ }
}

/* One sheet for both count and time amounts, in both add and edit modes. */
function AmountSheet({
  open, onClose, title, type, unit, currentValue, onAdd, onSet,
  addLabel = "افزودن به مجموع", withNote = false,
  initialValue, initialNote = "", initialPeriod, periodMode, today,
}) {
  const startVal = initialValue === undefined ? (type === "time" ? 0 : 1) : initialValue;
  const [val, setVal] = useState(type === "time" ? 0 : startVal);
  const [hours, setHours] = useState(Math.floor((type === "time" ? startVal : 0) / 60));
  const [minutes, setMinutes] = useState((type === "time" ? startVal : 0) % 60);
  const [note, setNote] = useState(initialNote || "");
  const [period, setPeriod] = useState(initialPeriod);

  // Stays mounted while closed, so re-sync each time it opens on a new target.
  useEffect(() => {
    if (!open) return;
    const s = initialValue === undefined ? (type === "time" ? 0 : 1) : initialValue;
    if (type === "time") { setHours(Math.floor(s / 60)); setMinutes(s % 60); }
    else setVal(s);
    setNote(initialNote || "");
    setPeriod(initialPeriod);
  }, [open, initialValue, initialNote, initialPeriod, type]);

  const amount = type === "time" ? hours * 60 + minutes : val;
  const noteArg = withNote ? (note.trim() || null) : undefined;

  return (
    <Sheet open={open} onClose={onClose} title={title}>
      {currentValue !== undefined && (
        <p className="dp-current">مقدار فعلی: <b>{formatAmount(type, currentValue, unit)}</b></p>
      )}
      {type === "time" ? (
        <DurationPicker hours={hours} minutes={minutes} setHours={setHours} setMinutes={setMinutes} />
      ) : (
        <>
          <label className="field-label">مقدار{unit ? ` (${unit})` : ""}</label>
          <div className="big-stepper">
            <button type="button" onClick={() => setVal((v) => Math.max(0, v - 1))} aria-label="کم کردن"><Minus size={16} /></button>
            <input className="text-input big-stepper-input" type="number" inputMode="numeric" value={val}
              onChange={(e) => setVal(Math.max(0, Number(e.target.value) || 0))} onFocus={(e) => e.target.select()} />
            <button type="button" onClick={() => setVal((v) => v + 1)} aria-label="زیاد کردن"><Plus size={16} /></button>
          </div>
        </>
      )}
      {periodMode === "daily" && today && <DayPicker today={today} value={period} onChange={setPeriod} />}
      {periodMode === "monthly" && today && <MonthPicker today={today} value={period} onChange={setPeriod} />}
      {withNote && <NoteField value={note} onChange={setNote} />}
      <button className="primary-btn" disabled={amount === 0} onClick={() => { onAdd(amount, noteArg, period); onClose(); }}>{addLabel}</button>
      {onSet && (
        <button className="secondary-btn" onClick={() => { onSet(amount, noteArg, period); onClose(); }}>
          جایگزینی مقدار کل با {formatAmount(type, amount, unit)}
        </button>
      )}
    </Sheet>
  );
}

              <li key={it.id} className="list-row">
                {it.category && <CategoryEdge id={it.category} />}
                <button className="row-body" onClick={() => { onOpenDetail({ kind: g.kind, id: it.id }); onClose(); }}>
                  <span className={"list-text" + (it.completed ? " list-text-done" : "")}>{it.title}</span>
                  {it.description && <span className="row-desc">{it.description}</span>}
                </button>
                {it.archived && <span className="archived-badge">آرشیو</span>}
              </li>
            ))}
          </ul>
        </div>
      ))}
    </Sheet>
  );
}

/* =========================================================================
   SEASON RING — the Jalali year splits into exactly 4 three-month seasons,
   a structural fact Gregorian months don't share. The ring shows it.
   ========================================================================= */

function SeasonRing({ jy, jm, jd }) {
  const season = seasonOfMonth(jm);
  const monthLen = jalaliMonthLength(jy, jm);
  const monthPct = (jd / monthLen) * 100;
  return (
    <div className="season-ring-wrap">
      <div className="season-ring">
        {SEASONS.map((s) => (
          <div key={s.name} className="season-group">
            {s.months.map((mi) => {
              const isCurrent = mi + 1 === jm;
              return (
                <div key={mi} className="season-seg" style={{ background: s.soft }}>
                  {isCurrent && <div className="season-seg-fill" style={{ width: `${monthPct}%`, background: s.color }} />}
                </div>
              );
            })}
          </div>
        ))}
      </div>
      <div className="season-ring-label">
        <span style={{ color: season.color, fontWeight: 700 }}>{season.name}</span>
        <span className="dot" /> {PERSIAN_MONTHS[jm - 1]} — روز {toFa(jd)} از {toFa(monthLen)}
      </div>
    </div>
  );
}

/* A history row. Collapsed it is one line; tapping reveals the full note and
   the edit/delete actions, so long notes never crowd the list. Entries that
   came from a linked weekly goal are read-only here and say where they came
   from — they are edited on the weekly goal itself. */
function LogEntryRow({ entry, targetType, unit, todayKey, currentLabel = "امروز", valueText, onEdit, onDelete }) {
  const [open, setOpen] = useState(false);
  const hasNote = !!entry.note;
  const dateText = formatPeriodKey(entry.dateKey) + (entry.dateKey === todayKey ? ` (${currentLabel})` : "");
  const shown = valueText !== undefined ? valueText : formatAmount(targetType, entry.value, unit);
  const expandable = !!(onEdit || onDelete || hasNote || entry.sourceTitle);
  return (
    <li className={"log-row" + (open ? " log-row-open" : "")}>
      <div className="log-row-top">
        {expandable ? (
          <button className="log-row-btn" onClick={() => setOpen((o) => !o)} aria-expanded={open}>
            <span className="log-date">{dateText}</span>
            {entry.sourceTitle && !open && <span className="log-src">از {entry.sourceTitle}</span>}
            {hasNote && !open && !entry.sourceTitle && <span className="log-note-preview">{entry.note}</span>}
            <ChevronDown size={13} className={open ? "chev-open" : ""} />
          </button>
        ) : (
          <span className="log-row-btn log-row-static"><span className="log-date">{dateText}</span></span>
        )}
        <span className="log-val">{shown}</span>
      </div>
      {open && (
        <>
          {entry.sourceTitle && <p className="log-note-full log-src-full"><ArrowUpRight size={12} /> از هدف هفتگی «{entry.sourceTitle}» — برای تغییر، همان‌جا ویرایشش کن.</p>}
          {hasNote && <p className="log-note-full">{entry.note}</p>}
          {(onEdit || onDelete) && (
            <div className="log-row-actions">
              {onEdit && <button className="mini-btn" onClick={onEdit}><Pencil size={12} /> ویرایش</button>}
              {onDelete && <button className="mini-btn mini-btn-danger" onClick={onDelete}><Trash2 size={12} /> حذف</button>}
            </div>
          )}
        </>
      )}
    </li>
  );
}

  const todayKey = dateKey(today.jy, today.jm, today.jd);

  const fed = linkedEntriesFor(goal, goals);
  const total = goalTotal(goal, goals);
  const ownSum = goalOwnProgress(goal);
  const fedSum = total - ownSum;

  const periodText = goal.type === "monthly"
    ? (() => { const [jy, jm] = goal.monthKey.split("-").map(Number); return `${PERSIAN_MONTHS[jm - 1]} ${toFa(jy)}`; })()
    : (() => { const [jy, jm, jd] = goal.weekKey.split("-").map(Number); const end = addDaysJalali(jy, jm, jd, 6); return `${toFa(jd)} ${PERSIAN_MONTHS[jm - 1]} تا ${toFa(end.jd)} ${PERSIAN_MONTHS[end.jm - 1]}`; })();

  const own = (goal.progressEntries || []).map((e) => ({ ...e }));
  const all = own.concat(fed).sort((a, b) => (a.dateKey < b.dateKey ? 1 : a.dateKey > b.dateKey ? -1 : 0));

  const mismatch = linked && isMeasurable(goal) && isMeasurable(linked) && goal.targetType !== linked.targetType;

  return (
    <>
      <DetailField label="دسته‌بندی"><CategoryChip id={goal.category} /></DetailField>
      <DetailField label="نوع">{goal.type === "monthly" ? "هدف ماهانه" : "هدف هفتگی"}</DetailField>
      <DetailField label="بازه">{periodText}</DetailField>
      {linked && <DetailField label="مرتبط با">{linked.title}{mismatch ? " (واحدها یکی نیست — پیشرفت منتقل نمی‌شود)" : ""}</DetailField>}
      {fed.length > 0 && <DetailField label="ورودی‌ها">{toFa(fed.length)} ثبت از اهداف هفتگی مرتبط</DetailField>}
      {goal.reminderTime && <DetailField label="یادآوری">هر روز ساعت {toFa(goal.reminderTime)}</DetailField>}
      {goal.rolloverCount > 0 && <DetailField label="انتقال">{toFa(goal.rolloverCount)} بار از بازهٔ قبل منتقل شده</DetailField>}
      {goal.description && <DetailField label="توضیحات"><span className="detail-desc">{goal.description}</span></DetailField>}

      {measurable ? (
        <div className="detail-progress">
          <div className="detail-progress-head">
            <span>پیشرفت</span>
            <b>{progressTextFor(goal, total)}</b>
          </div>
          <ProgressBar value={progressPctFor(goal, total)} color={goal.completed ? "var(--c-success)" : "var(--c-primary)"} />
          {fedSum > 0 && (
            <p className="detail-split">
              مستقیم: {formatAmount(goal.targetType, ownSum, goal.unit)} · از اهداف هفتگی: {formatAmount(goal.targetType, fedSum, goal.unit)}
            </p>
          )}
          {goal.completed && <p className="detail-done-note"><Check size={13} /> به هدف رسیدی</p>}
          <button className="primary-btn" onClick={() => setAmountSheet(true)}><Plus size={15} /> ثبت پیشرفت</button>

          {all.length > 0 && (
            <>
              <span className="detail-label detail-log-title">ثبت‌های پیشرفت</span>
              <ul className="log-list">
                {all.map((entry) => (
                  <LogEntryRow key={entry.id} entry={entry} targetType={goal.targetType} unit={goal.unit} todayKey={todayKey}
                    onEdit={entry.sourceTitle ? undefined : () => setEditEntry(entry)}
                    onDelete={entry.sourceTitle ? undefined : () => onClearLogEntry(goal.id, entry.id)} />
                ))}
              </ul>
            </>
          )}
        </div>
      ) : (
        <button className={"toggle-big-btn" + (goal.completed ? " toggle-big-done" : "")} onClick={() => onToggle(goal.id)}>
          {goal.completed ? <><Check size={15} /> انجام شده — برگرداندن</> : "علامت‌گذاری به‌عنوان انجام‌شده"}
        </button>
      )}

      <DetailActions onEdit={onEdit} onDelete={onDelete} />

      {measurable && (
        <>
          <AmountSheet
            open={amountSheet} onClose={() => setAmountSheet(false)} title="ثبت پیشرفت"
            type={goal.targetType} unit={goal.unit} currentValue={total}
            withNote periodMode="daily" today={today} initialPeriod={todayKey} addLabel="ثبت"
            onAdd={(v, note, dk) => onLogProgress(goal.id, dk || todayKey, v, note)} />
          <AmountSheet
            open={!!editEntry} onClose={() => setEditEntry(null)} title="ویرایش ثبت"
            type={goal.targetType} unit={goal.unit}
            withNote periodMode="daily" today={today}
            initialValue={editEntry ? editEntry.value : undefined}
            initialNote={editEntry ? editEntry.note || "" : ""}
            initialPeriod={editEntry ? editEntry.dateKey : todayKey}
            addLabel="ذخیرهٔ تغییرات"
            onAdd={(v, note, dk) => onUpdateEntry(goal.id, editEntry.id, { value: v, note, dateKey: dk || editEntry.dateKey })} />
        </>
      )}
    </>
  );
}

function HabitDetail({ habit, today, onEdit, onDelete, onToggle, onSetValue }) {
  const [sheet, setSheet] = useState(false);
  const [editDay, setEditDay] = useState(null);
  const tKey = dateKey(today.jy, today.jm, today.jd);
  const measured = habitMeasured(habit);
  const value = habitDayValue(habit, tKey);
  const ok = habitDaySuccess(habit, tKey);
  const streak = habitStreak(habit, today);
  const { days, elapsed } = habitWeekDays(habit, today);
  const last30 = useMemo(() => {
    const start = addDaysJalali(today.jy, today.jm, today.jd, -29);
    return Array.from({ length: 30 }, (_, i) => addDaysJalali(start.jy, start.jm, start.jd, i));
  }, [tKey]); // eslint-disable-line react-hooks/exhaustive-deps
  const categories = useContext(CategoriesContext);
  const palette = COLOR_PALETTE[categoryOf(categories, habit.category).colorKey] || COLOR_PALETTE.slate;
  const successCount = last30.filter((d) => habitDaySuccess(habit, dateKey(d.jy, d.jm, d.jd))).length;

  const weeklyText = (() => {
    if (habit.weeklyMin == null && habit.weeklyMax == null) return null;
    let s = `${toFa(days)} روز موفق از ${toFa(elapsed)} روز گذشتهٔ این هفته`;
    if (habit.weeklyMin != null) s += ` · حداقل ${toFa(habit.weeklyMin)}`;
    if (habit.weeklyMax != null) s += ` · حداکثر ${toFa(habit.weeklyMax)}`;
    return s;
  })();

  const targetDay = editDay || tKey;
  const targetVal = habitDayValue(habit, targetDay);

  return (
    <>
      <DetailField label="دسته‌بندی"><CategoryChip id={habit.category} /></DetailField>
      <DetailField label="نوع">{(HABIT_METRICS.find((m) => m.id === (habit.metric || "simple")) || {}).label}</DetailField>
      {habitTargetText(habit) && <DetailField label="محدوده">{habitTargetText(habit)}</DetailField>}
      <DetailField label="روزهای پیاپی">{toFa(streak)} روز</DetailField>
      {weeklyText && <DetailField label="این هفته">{weeklyText}</DetailField>}
      <DetailField label="۳۰ روز اخیر">{toFa(successCount)} روز موفق</DetailField>
      {habit.reminderTime && <DetailField label="یادآوری">هر روز ساعت {toFa(habit.reminderTime)}</DetailField>}
      {habit.description && <DetailField label="توضیحات"><span className="detail-desc">{habit.description}</span></DetailField>}

      <div className="detail-progress">
        <div className="detail-progress-head">
          <span>امروز</span>
          <b className={ok ? "val-ok" : "val-off"}>
            {measured ? formatAmount(habit.metric, value, habit.unit) : (ok ? "انجام شده" : "انجام نشده")}
            {measured && (ok ? " ✓" : "")}
          </b>
        </div>
        {measured ? (
          <button className="primary-btn" onClick={() => setSheet(true)}><Plus size={15} /> ثبت مقدار</button>
        ) : (
          <button className={"toggle-big-btn" + (ok ? " toggle-big-done" : "")} onClick={() => onToggle(habit.id, tKey)}>
            {ok ? <><Check size={15} /> برگرداندن</> : "ثبت انجام برای امروز"}
          </button>
        )}
      </div>

      <span className="detail-label detail-log-title">۳۰ روز اخیر</span>
      <div className="heatmap">
        {last30.map((d) => {
          const dk = dateKey(d.jy, d.jm, d.jd);
          const good = habitDaySuccess(habit, dk);
          return <span key={dk} className="heat-cell" title={`${toFa(d.jd)} ${PERSIAN_MONTHS[d.jm - 1]}`}
            style={{ background: good ? palette.hex : "var(--c-track)" }} />;
        })}
      </div>

      <DetailActions onEdit={onEdit} onDelete={onDelete} />

      {measured && (
        <AmountSheet
          open={sheet || !!editDay} onClose={() => { setSheet(false); setEditDay(null); }}
          title={editDay ? "ویرایش مقدار" : "ثبت مقدار امروز"}
          type={habit.metric} unit={habit.unit} currentValue={targetVal}
          periodMode="daily" today={today} initialPeriod={targetDay}
          addLabel="افزودن به مقدار روز"
          onAdd={(v, _n, dk) => onSetValue(habit.id, dk || targetDay, habitDayValue(habit, dk || targetDay) + v)}
          onSet={(v, _n, dk) => onSetValue(habit.id, dk || targetDay, v)} />
      )}
    </>
  );
}

    .slice().sort((a, b) => (a.periodKey < b.periodKey ? 1 : a.periodKey > b.periodKey ? -1 : 0));
  const curTotal = periodTotal(trackerEntries, item, curKey);
  const typeLabel = (TRACKER_TYPES.find((t) => t.id === item.type) || {}).label;

  return (
    <>
      <DetailField label="نوع ثبت">{typeLabel}</DetailField>

      {item.unit && <DetailField label="واحد">{item.unit}</DetailField>}

      {item.description && <DetailField label="توضیحات"><span className="detail-desc">{item.description}</span></DetailField>}

      <div className="detail-progress">
        <div className="detail-progress-head">
          <span>{monthly ? "این ماه" : "امروز"}</span>
          <b>{item.type === "boolean" ? (curTotal ? "انجام شده" : "انجام نشده") : formatAmount(item.type, curTotal, item.unit)}</b>
        </div>
        {item.type === "boolean" ? (
          <button className={"toggle-big-btn" + (curTotal ? " toggle-big-done" : "")}
            onClick={() => curTotal ? onDeleteEntry(item.id, curKey, true) : onAddEntry(item.id, curKey, true, null)}>
            {curTotal ? <><Check size={15} /> برگرداندن</> : "ثبت انجام"}
          </button>
        ) : (
          <button className="primary-btn" onClick={() => setSheet(true)}><Plus size={15} /> ثبت مقدار</button>
        )}
      </div>

      {mine.length > 0 && (
        <>
          <span className="detail-label detail-log-title">همهٔ ثبت‌ها</span>
          <ul className="log-list">
            {mine.map((e) => (
              <LogEntryRow key={e.id} entry={{ ...e, dateKey: e.periodKey }} targetType={item.type} unit={item.unit} todayKey={curKey}
                currentLabel={monthly ? "این ماه" : "امروز"}
                valueText={item.type === "boolean" ? "✓" : formatAmount(item.type, e.value, item.unit)}
                onEdit={item.type === "boolean" ? undefined : () => setEditEntry(e)}
                onDelete={() => onDeleteEntry(item.id, e.periodKey, false, e.id)} />
            ))}
          </ul>
        </>
      )}

      <DetailActions onEdit={onEdit} onDelete={onDelete}
        extra={<button className="secondary-btn" onClick={() => onToggleArchive(item.id)}>
          {item.archived ? <><RotateBack size={14} /> بازگردانی</> : <><Archive size={14} /> آرشیو</>}
        </button>} />

      {item.type !== "boolean" && (
        <>
          <AmountSheet
            open={sheet} onClose={() => setSheet(false)} title="ثبت مقدار"
            type={item.type} unit={item.unit} currentValue={curTotal}
            withNote periodMode={monthly ? "monthly" : "daily"} today={today} initialPeriod={curKey} addLabel="ثبت"
            onAdd={(v, note, pk) => onAddEntry(item.id, pk || curKey, v, note)} />
          <AmountSheet
            open={!!editEntry} onClose={() => setEditEntry(null)} title="ویرایش ثبت"
            type={item.type} unit={item.unit}
            withNote periodMode={monthly ? "monthly" : "daily"} today={today}
            initialValue={editEntry ? editEntry.value : undefined}
            initialNote={editEntry ? editEntry.note || "" : ""}
            initialPeriod={editEntry ? editEntry.periodKey : curKey}
            addLabel="ذخیرهٔ تغییرات"
            onAdd={(v, note, pk) => onUpdateEntry(editEntry.id, { value: v, note, periodKey: pk || editEntry.periodKey })} />
        </>
      )}
    </>
  );
}

function BoundInput({ label, metric, unit, value, onChange }) {
  // A bound is optional: empty means "no limit".
  const [h, setH] = useState(value != null && metric === "time" ? Math.floor(value / 60) : 0);
  const [m, setM] = useState(value != null && metric === "time" ? value % 60 : 0);
  useEffect(() => {
    if (metric !== "time") return;
    if (value == null) { setH(0); setM(0); } else { setH(Math.floor(value / 60)); setM(value % 60); }
  }, [value, metric]);
  const enabled = value != null;
  return (
    <div className="bound-block">
      <label className="toggle-row toggle-row-tight">
        <input type="checkbox" checked={enabled} onChange={(e) => onChange(e.target.checked ? (metric === "time" ? h * 60 + m : 1) : null)} />
        <span>{label}</span>
      </label>
      {enabled && (metric === "time" ? (
        <DurationPicker hours={h} minutes={m}
          setHours={(nh) => { setH(nh); onChange(nh * 60 + m); }}
          setMinutes={(nm) => { setM(nm); onChange(h * 60 + nm); }} />
      ) : (
        <div className="big-stepper">
          <button type="button" onClick={() => onChange(Math.max(0, value - 1))} aria-label="کم کردن"><Minus size={16} /></button>
          <input className="text-input big-stepper-input" type="number" inputMode="numeric" value={value}
            onChange={(e) => onChange(Math.max(0, Number(e.target.value) || 0))} onFocus={(e) => e.target.select()} />
          <button type="button" onClick={() => onChange(value + 1)} aria-label="زیاد کردن"><Plus size={16} /></button>
        </div>
      ))}
      {enabled && unit && metric === "count" && <p className="field-hint">واحد: {unit}</p>}
    </div>
  );
}

function GoalForm({ initial, monthlyGoals, onSave }) {
  const categories = useContext(CategoriesContext);
  const [title, setTitle] = useState(initial?.title || "");
  const [description, setDescription] = useState(initial?.description || "");

  const [targetType, setTargetType] = useState(initial?.targetType || "simple");
  const [unit, setUnit] = useState(initial?.unit || "");
  const [reminderTime, setReminderTime] = useState(initial?.reminderTime || "");
  const [countTarget, setCountTarget] = useState(initial?.targetType === "count" ? initial.targetValue : 10);
  const initMins = initial?.targetType === "time" ? initial.targetValue : 0;
  const [tHours, setTHours] = useState(Math.floor(initMins / 60));
  const [tMinutes, setTMinutes] = useState(initMins % 60);

  const timeTarget = tHours * 60 + tMinutes;
  const targetValue = targetType === "count" ? countTarget : targetType === "time" ? timeTarget : null;
  const valid = title.trim() && (targetType === "simple" || (targetValue && targetValue > 0));
  const parent = monthlyGoals && linkedMonthlyId ? monthlyGoals.find((g) => g.id === linkedMonthlyId) : null;
  const willFeed = parent && isMeasurable(parent) && parent.targetType === targetType;
  const unitClash = parent && isMeasurable(parent) && targetType !== "simple" && parent.targetType !== targetType;

  return (
    <div className="form">
      <label className="field-label">عنوان هدف</label>

      <CategoryPicker value={category} onChange={setCategory} />

      <label className="field-label">نحوهٔ سنجش</label>
      <Segmented options={[{ id: "simple", label: "ساده" }, { id: "count", label: "تعدادی" }, { id: "time", label: "زمانی" }]}
        value={targetType} onChange={setTargetType} />

      {targetType === "count" && (
        <>
          <label className="field-label">مقدار هدف</label>
          <div className="big-stepper">
            <button type="button" onClick={() => setCountTarget((v) => Math.max(1, v - 1))} aria-label="کم کردن"><Minus size={16} /></button>
            <input className="text-input big-stepper-input" type="number" inputMode="numeric" value={countTarget}
              onChange={(e) => setCountTarget(Math.max(1, Number(e.target.value) || 1))} onFocus={(e) => e.target.select()} />
            <button type="button" onClick={() => setCountTarget((v) => v + 1)} aria-label="زیاد کردن"><Plus size={16} /></button>
          </div>
          <label className="field-label">واحد (اختیاری)</label>
          <input className="text-input" value={unit} onChange={(e) => setUnit(e.target.value)} placeholder="مثلاً: صفحه، جلسه، بار" />
        </>
      )}

      {targetType === "time" && (
        <>
          <label className="field-label">زمان هدف</label>
          <DurationPicker hours={tHours} minutes={tMinutes} setHours={setTHours} setMinutes={setTMinutes} />
        </>
      )}

      {monthlyGoals && monthlyGoals.length > 0 && (
        <>
          <label className="field-label">مرتبط با هدف ماهانه (اختیاری)</label>
          <select className="text-input" value={linkedMonthlyId} onChange={(e) => setLinkedMonthlyId(e.target.value)}>
            <option value="">بدون ارتباط</option>
            {monthlyGoals.map((g) => <option key={g.id} value={g.id}>{g.title}</option>)}
          </select>
          {willFeed && <p className="field-hint field-hint-ok">هر پیشرفتی که اینجا ثبت کنی، به هدف ماهانه هم اضافه می‌شود.</p>}
          {unitClash && <p className="field-hint field-hint-warn">واحد این هدف با هدف ماهانه یکی نیست، پس پیشرفت منتقل نمی‌شود. برای انتقال، هر دو باید «{parent.targetType === "time" ? "زمانی" : "تعدادی"}» باشند.</p>}
        </>
      )}

      <label className="field-label"><Bell size={12} /> یادآوری روزانه (اختیاری)</label>
      <input type="time" className="text-input" value={reminderTime} onChange={(e) => setReminderTime(e.target.value)} />
      <p className="field-hint">تا وقتی این هدف تمام نشده، هر روز در این ساعت یادآوری می‌شود.</p>

      <button className="primary-btn" disabled={!valid}
        onClick={() => valid && onSave({
          title: title.trim(), description: description.trim() || null, category,
          linkedMonthlyId: linkedMonthlyId || null,
          targetType, targetValue, unit: targetType === "count" ? (unit.trim() || null) : null,
          reminderTime: reminderTime || null,
        })}>
        ذخیره
      </button>
    </div>
  );
}

function DashboardTab({ today, goals, tasks, habits, toggleTask, toggleHabit, setTab, openDetail,
  overdueTasks, overdueGoals, rolloverTasks, rolloverGoals }) {
  const tKey = dateKey(today.jy, today.jm, today.jd);
  const todaysTasks = tasks.filter((t) => t.dateKey === tKey);
  const doneTasks = todaysTasks.filter((t) => t.completed).length;
  const doneHabits = habits.filter((h) => habitDaySuccess(h, tKey)).length;

  const mKey = monthKey(today.jy, today.jm);
  const monthlyGoals = goals.filter((g) => g.type === "monthly" && g.monthKey === mKey);
  const monthDone = monthlyGoals.filter((g) => g.completed).length;
  const weekStart = getWeekStart(today.jy, today.jm, today.jd);
  const wKey = dateKey(weekStart.jy, weekStart.jm, weekStart.jd);
  const weeklyGoals = goals.filter((g) => g.type === "weekly" && g.weekKey === wKey);
  const weekDone = weeklyGoals.filter((g) => g.completed).length;

  return (
    <div className="tab-pane">
      <RolloverBanner count={overdueTasks.length} label="کار انجام‌نشده از روزهای گذشته" onRollover={rolloverTasks} />
      <RolloverBanner count={overdueGoals.length} label="هدف ناتمام از بازه‌های گذشته" onRollover={rolloverGoals} />

      <div className="stat-row">
        <div className="stat-card"><span className="stat-num">{toFa(doneTasks)}<span className="stat-of">/{toFa(todaysTasks.length)}</span></span><span className="stat-label">وظیفه امروز</span></div>
        <div className="stat-card"><span className="stat-num">{toFa(doneHabits)}<span className="stat-of">/{toFa(habits.length)}</span></span><span className="stat-label">عادت امروز</span></div>
        <div className="stat-card"><span className="stat-num">{toFa(monthDone)}<span className="stat-of">/{toFa(monthlyGoals.length)}</span></span><span className="stat-label">هدف این ماه</span></div>
      </div>

      <section className="section">
        <div className="section-head"><h3>وظایف امروز</h3><button className="link-btn" onClick={() => setTab("tasks")}>مشاهده همه</button></div>
        {todaysTasks.length === 0 ? <EmptyState text="امروز کاری ثبت نشده" sub="از تب وظایف یکی اضافه کن" /> : (
          <ul className="list">{todaysTasks.slice(0, 5).map((t) => <TaskRow key={t.id} task={t} onToggle={toggleTask} onOpen={openDetail} />)}</ul>
        )}
      </section>

      <section className="section">
        <div className="section-head"><h3>عادت‌های امروز</h3><button className="link-btn" onClick={() => setTab("habits")}>مشاهده همه</button></div>
        {habits.length === 0 ? <EmptyState text="هنوز عادتی ثبت نشده" sub="از تب عادت‌ها یکی اضافه کن" /> : (
          <ul className="list">
            {habits.slice(0, 5).map((h) => {
              const ok = habitDaySuccess(h, tKey);
              return (
                <li key={h.id} className="list-row">
                  <CategoryEdge id={h.category} />
                  {habitMeasured(h) ? (
                    <span className={"status-dot" + (ok ? " status-dot-ok" : "")}>{ok && <Check size={12} strokeWidth={3} />}</span>
                  ) : (
                    <button className={"check-circle" + (ok ? " check-circle-done" : "")} onClick={() => toggleHabit(h.id, tKey)} aria-label="تغییر وضعیت">
                      {ok && <Check size={13} strokeWidth={3} />}
                    </button>
                  )}
                  <button className="row-body" onClick={() => openDetail({ kind: "habit", id: h.id })}>
                    <span className={"list-text" + (ok && !habitMeasured(h) ? " list-text-done" : "")}>{h.title}</span>
                  </button>
                  <CategoryChip id={h.category} />
                </li>
              );
            })}
          </ul>
        )}
      </section>

      {(monthlyGoals.length > 0 || weeklyGoals.length > 0) && (
        <section className="section">
          <div className="section-head"><h3>پیشرفت اهداف</h3></div>
          {monthlyGoals.length > 0 && (
            <div className="goal-progress-row">
              <div className="goal-progress-label">هدف‌های ماهانه</div>
              <ProgressBar value={(monthDone / monthlyGoals.length) * 100} />
            </div>
          )}
          {weeklyGoals.length > 0 && (
            <div className="goal-progress-row">
              <div className="goal-progress-label">هدف‌های هفتگی</div>
              <ProgressBar value={(weekDone / weeklyGoals.length) * 100} color="var(--c-saffron)" />
            </div>
          )}
        </section>
      )}
    </div>
  );
}

function GoalsTab({ today, goals, addGoal, toggleGoal, openDetail, overdueGoals, rolloverGoals }) {
  const [mode, setMode] = useState("monthly");
  const [cursor, setCursor] = useState(today);
  const [sheetOpen, setSheetOpen] = useState(false);

  const weekStart = getWeekStart(cursor.jy, cursor.jm, cursor.jd);
  const wKey = dateKey(weekStart.jy, weekStart.jm, weekStart.jd);
  const weekEnd = addDaysJalali(weekStart.jy, weekStart.jm, weekStart.jd, 6);
  const mKey = monthKey(cursor.jy, cursor.jm);

  const shown = mode === "monthly"
    ? goals.filter((g) => g.type === "monthly" && g.monthKey === mKey)
    : goals.filter((g) => g.type === "weekly" && g.weekKey === wKey);
  const allMonthlyGoals = goals.filter((g) => g.type === "monthly");

  function goPrev() {
    if (mode === "monthly") setCursor({ ...addMonthsJalali(cursor.jy, cursor.jm, -1), jd: 1 });
    else setCursor(addDaysJalali(cursor.jy, cursor.jm, cursor.jd, -7));
  }
  function goNext() {
    if (mode === "monthly") setCursor({ ...addMonthsJalali(cursor.jy, cursor.jm, 1), jd: 1 });
    else setCursor(addDaysJalali(cursor.jy, cursor.jm, cursor.jd, 7));
  }

  return (
    <div className="tab-pane">
      <RolloverBanner count={overdueGoals.length} label="هدف ناتمام از بازه‌های گذشته" onRollover={rolloverGoals} />
      <Segmented options={[{ id: "monthly", label: "ماهانه" }, { id: "weekly", label: "هفتگی" }]} value={mode} onChange={setMode} />

      <div className="period-nav">
        <IconBtn onClick={goPrev} label="قبلی"><ChevronRight size={18} /></IconBtn>
        <span className="period-label">
          {mode === "monthly" ? `${PERSIAN_MONTHS[cursor.jm - 1]} ${toFa(cursor.jy)}` : `${toFa(weekStart.jd)} ${PERSIAN_MONTHS[weekStart.jm - 1]} تا ${toFa(weekEnd.jd)} ${PERSIAN_MONTHS[weekEnd.jm - 1]}`}
        </span>
        <IconBtn onClick={goNext} label="بعدی"><ChevronLeft size={18} /></IconBtn>
      </div>

      {shown.length === 0 ? (
        <EmptyState text={mode === "monthly" ? "هدفی برای این ماه ثبت نشده" : "هدفی برای این هفته ثبت نشده"} sub="با دکمهٔ زیر یک هدف اضافه کن" />
      ) : (
        <ul className="list">
          {shown.map((g) => (
            <GoalRow key={g.id} goal={g} total={goalTotal(g, goals)}
              linkedTitle={g.linkedMonthlyId ? goals.find((m) => m.id === g.linkedMonthlyId)?.title : null}
              feedsCount={g.type === "monthly" ? goals.filter((x) => x.linkedMonthlyId === g.id && x.targetType === g.targetType).length : 0}
              onToggle={toggleGoal} onOpen={openDetail} />
          ))}
        </ul>
      )}

      <button className="fab" onClick={() => setSheetOpen(true)} aria-label="افزودن هدف"><Plus size={22} /></button>
      <Sheet open={sheetOpen} onClose={() => setSheetOpen(false)} title={mode === "monthly" ? "هدف ماهانهٔ جدید" : "هدف هفتگی جدید"}>
        <GoalForm monthlyGoals={mode === "weekly" ? allMonthlyGoals : null}
          onSave={(data) => {
            addGoal({
              id: uid(), ...data, type: mode,
              monthKey: mode === "monthly" ? mKey : null,
              weekKey: mode === "weekly" ? wKey : null,
              linkedMonthlyId: mode === "weekly" ? data.linkedMonthlyId : null,
              completed: false, progressEntries: [], rolloverCount: 0, lastReminderKey: null,
            });
            setSheetOpen(false);
          }} />
      </Sheet>
    </div>
  );
}

function TasksTab({ today, tasks, goals, addTask, toggleTask, openDetail, overdueTasks, rolloverTasks }) {
  const [cursor, setCursor] = useState(today);
  const [sheetOpen, setSheetOpen] = useState(false);
  const strip = useMemo(() => {
    const start = addDaysJalali(cursor.jy, cursor.jm, cursor.jd, -3);
    return Array.from({ length: 7 }, (_, i) => addDaysJalali(start.jy, start.jm, start.jd, i));
  }, [cursor.jy, cursor.jm, cursor.jd]);
  const cKey = dateKey(cursor.jy, cursor.jm, cursor.jd);
  const dayTasks = tasks.filter((t) => t.dateKey === cKey);

  return (
    <div className="tab-pane">
      <RolloverBanner count={overdueTasks.length} label="کار انجام‌نشده از روزهای گذشته" onRollover={rolloverTasks} />
      <div className="period-nav">
        <IconBtn onClick={() => setCursor(addDaysJalali(cursor.jy, cursor.jm, cursor.jd, -1))} label="روز قبل"><ChevronRight size={18} /></IconBtn>
        <span className="period-label">{PERSIAN_WEEKDAYS[persianWeekdayIndex(cursor.jy, cursor.jm, cursor.jd)]}، {toFa(cursor.jd)} {PERSIAN_MONTHS[cursor.jm - 1]}</span>
        <IconBtn onClick={() => setCursor(addDaysJalali(cursor.jy, cursor.jm, cursor.jd, 1))} label="روز بعد"><ChevronLeft size={18} /></IconBtn>
      </div>
      <div className="day-strip">
        {strip.map((d) => {
          const isToday = sameDate(d, today);
          const isSel = sameDate(d, cursor);
          return (
            <button key={dateKey(d.jy, d.jm, d.jd)} className={"day-chip" + (isSel ? " day-chip-active" : "") + (isToday ? " day-chip-today" : "")} onClick={() => setCursor(d)}>
              <span className="day-chip-wd">{PERSIAN_WEEKDAYS_SHORT[persianWeekdayIndex(d.jy, d.jm, d.jd)]}</span>
              <span className="day-chip-num">{toFa(d.jd)}</span>
            </button>
          );
        })}
      </div>
      {!sameDate(cursor, today) && <button className="link-btn today-jump" onClick={() => setCursor(today)}>برو به امروز</button>}
      {dayTasks.length === 0 ? <EmptyState text="کاری برای این روز ثبت نشده" sub="با دکمهٔ زیر یکی اضافه کن" /> : (
        <ul className="list">{dayTasks.map((t) => <TaskRow key={t.id} task={t} onToggle={toggleTask} onOpen={openDetail} />)}</ul>
      )}
      <button className="fab" onClick={() => setSheetOpen(true)} aria-label="افزودن کار"><Plus size={22} /></button>
      <Sheet open={sheetOpen} onClose={() => setSheetOpen(false)} title="کار جدید">
        <TaskForm goals={goals} onSave={(data) => {
          addTask({ id: uid(), ...data, dateKey: cKey, completed: false, reminderFired: false, rolloverCount: 0 });
          setSheetOpen(false);
        }} />
      </Sheet>
    </div>
  );
}

      <button className="row-body" onClick={() => onOpen({ kind: "tracker", id: item.id })}>
        <span className="list-text">{item.title}</span>
        {notes.length > 0

      {item.type === "boolean" && (
        <button className={"check-circle" + (value ? " check-circle-done" : "")} onClick={() => onToggleBool(!value)} aria-label="تغییر وضعیت">
          {value && <Check size={13} strokeWidth={3} />}
        </button>
      )}
      {item.type === "count" && (
        <div className="stepper">
          <button onClick={() => onQuickAdd(-1)} aria-label="کم کردن"><Minus size={13} /></button>

        <button className="time-chip" onClick={onOpenAmount}><Clock size={12} />{formatMinutes(value)}</button>

});

function TrackerGroupCard({ group, items, entries, today, onAddEntry, onQuickAdd, onToggleBool,
  onOpenDetail, onAddItem, onEditGroup, onDeleteGroup, onArchiveGroup, onOpenAmount }) {
  const monthly = group.period === "monthly";
  const [cursor, setCursor] = useState(today);
  const periodKey = groupPeriodKey(group, cursor);
  const isCurrent = periodKey === groupPeriodKey(group, today);

  const summarySpan = useMemo(() => {
    if (monthly) return [periodKey];
    const start = addDaysJalali(cursor.jy, cursor.jm, cursor.jd, -6);
    return Array.from({ length: 7 }, (_, i) => {
      const d = addDaysJalali(start.jy, start.jm, start.jd, i);
      return dateKey(d.jy, d.jm, d.jd);
    });
  }, [monthly, periodKey, cursor.jy, cursor.jm, cursor.jd]);

  function shift(dir) {
    setCursor(monthly ? { ...addMonthsJalali(cursor.jy, cursor.jm, dir), jd: 1 } : addDaysJalali(cursor.jy, cursor.jm, cursor.jd, dir));
  }

  return (
    <div className={"group-card" + (group.archived ? " group-card-archived" : "")}>
      <div className="group-card-head">
        <div className="group-card-titles">
          <h4>{group.title}
            <span className="group-period-tag">{monthly ? <><CalendarIcon size={10} /> ماهانه</> : "روزانه"}</span>
            {group.archived && <span className="archived-badge">آرشیو</span>}
          </h4>
          {group.description && <span className="row-desc">{group.description}</span>}
        </div>
        <IconBtn onClick={() => onArchiveGroup(group.id)} label={group.archived ? "بازگردانی گروه" : "آرشیو گروه"}>
          {group.archived ? <RotateBack size={14} /> : <Archive size={14} />}
        </IconBtn>
        <IconBtn onClick={() => onEditGroup(group)} label="ویرایش گروه"><Pencil size={14} /></IconBtn>
        <IconBtn onClick={() => onDeleteGroup(group.id)} label="حذف گروه"><Trash2 size={15} /></IconBtn>
      </div>

      <div className="period-nav period-nav-sm">
        <IconBtn onClick={() => shift(-1)} label="قبلی"><ChevronRight size={16} /></IconBtn>
        <span className="period-label-sm">{formatPeriodKey(periodKey)}{isCurrent ? (monthly ? " (این ماه)" : " (امروز)") : ""}</span>
        <IconBtn onClick={() => shift(1)} label="بعدی"><ChevronLeft size={16} /></IconBtn>
      </div>

      {items.length === 0 ? (
        <EmptyState text="موردی در این گروه نیست" sub="یک مورد برای ردیابی اضافه کن" />
      ) : (
        <>
          <ul className="list">
            {items.map((item) => {
              const value = periodTotal(entries, item, periodKey);
              const notes = entriesForPeriod(entries, item.id, periodKey).filter((e) => e.note).map((e) => e.note);
              return (
                <TrackerItemRow key={item.id} item={item} value={value} notes={notes}
                  onToggleBool={(v) => onToggleBool(item, periodKey, v)}
                  onQuickAdd={(d) => onQuickAdd(item, periodKey, d)}
                  onOpen={onOpenDetail}
                  onOpenAmount={() => onOpenAmount(item, periodKey, value, monthly)} />
              );
            })}
          </ul>

          <div className="group-summary">
            <div className="group-summary-title">{monthly ? `خلاصهٔ ${formatPeriodKey(periodKey)}` : "نتیجه و خلاصه (۷ روز اخیر)"}</div>
            {items.map((item) => {
              let text;
              if (item.type === "boolean") {
                const doneCount = summarySpan.filter((pk) => periodTotal(entries, item, pk)).length;
                text = monthly ? (doneCount ? "انجام شده" : "انجام نشده") : `${toFa(doneCount)} از ${toFa(7)} روز`;
              } else {
                const total = summarySpan.reduce((s, pk) => s + periodTotal(entries, item, pk), 0);
                text = item.type === "time"
                  ? `مجموع ${formatMinutes(total)}`
                  : `مجموع ${toFa(total)}${item.unit ? " " + item.unit : ""}` + (monthly ? "" : ` · میانگین ${toFa(Math.round(total / 7))}`);
              }
              return <div key={item.id} className="group-summary-row"><span>{item.title}</span><span className="group-summary-val">{text}</span></div>;
            })}
          </div>
        </>
      )}

      <button className="add-inline-btn" onClick={() => onAddItem(group.id)}><Plus size={15} /> افزودن مورد</button>
    </div>
  );
}

function TrackerTab({ today, trackerGroups, trackerItems, trackerEntries, addGroup, editGroup, deleteGroup,
  archiveGroup, addItem, addEntry, quickAdd, toggleBool, openDetail }) {
  const [groupSheetOpen, setGroupSheetOpen] = useState(false);
  const [editingGroup, setEditingGroup] = useState(null);
  const [itemSheetGroupId, setItemSheetGroupId] = useState(null);
  const [amountTarget, setAmountTarget] = useState(null);
  const [showArchive, setShowArchive] = useState(false);

  const visibleGroups = trackerGroups.filter((g) => !!g.archived === showArchive);
  const archivedCount = trackerGroups.filter((g) => g.archived).length
    + trackerItems.filter((i) => i.archived && !trackerGroups.find((g) => g.id === i.groupId)?.archived).length;

  return (
    <div className="tab-pane">
      {(archivedCount > 0 || showArchive) && (
        <button className={"archive-toggle" + (showArchive ? " archive-toggle-on" : "")} onClick={() => setShowArchive((v) => !v)}>
          {showArchive ? <><RotateBack size={14} /> بازگشت به فهرست اصلی</> : <><Archive size={14} /> آرشیو ({toFa(archivedCount)})</>}
        </button>
      )}

      {visibleGroups.length === 0 ? (
        <EmptyState text={showArchive ? "آرشیو خالی است" : "هنوز گروهی ثبت نشده"} sub={showArchive ? "" : "یک گروه بساز و موردهایی برای ردیابی اضافه کن"} />
      ) : (
        visibleGroups.map((g) => (
          <TrackerGroupCard key={g.id} group={g}
            items={trackerItems.filter((it) => it.groupId === g.id && (!!it.archived === showArchive || g.archived))}
            entries={trackerEntries} today={today}
            onAddEntry={addEntry} onQuickAdd={quickAdd} onToggleBool={toggleBool}
            onOpenDetail={openDetail} onAddItem={setItemSheetGroupId}
            onEditGroup={setEditingGroup} onDeleteGroup={deleteGroup} onArchiveGroup={archiveGroup}
            onOpenAmount={(item, periodKey, value, monthly) => setAmountTarget({ item, periodKey, value, monthly })} />
        ))
      )}

      {!showArchive && <button className="fab" onClick={() => setGroupSheetOpen(true)} aria-label="افزودن گروه"><Plus size={22} /></button>}

      <Sheet open={groupSheetOpen} onClose={() => setGroupSheetOpen(false)} title="گروه جدید">
        <GroupForm onSave={(data) => { addGroup({ id: uid(), ...data, archived: false }); setGroupSheetOpen(false); }} />
      </Sheet>
      <Sheet open={!!editingGroup} onClose={() => setEditingGroup(null)} title="ویرایش گروه">
        {editingGroup && <GroupForm initial={editingGroup} onSave={(data) => { editGroup(editingGroup.id, data); setEditingGroup(null); }} />}
      </Sheet>
      <Sheet open={!!itemSheetGroupId} onClose={() => setItemSheetGroupId(null)} title="مورد جدید">
        <TrackerItemForm onSave={(data) => { addItem({ id: uid(), groupId: itemSheetGroupId, ...data, archived: false }); setItemSheetGroupId(null); }} />
      </Sheet>

      {amountTarget && (
        <AmountSheet
          open={true} onClose={() => setAmountTarget(null)} title={`ثبت — ${amountTarget.item.title}`}
          type={amountTarget.item.type} unit={amountTarget.item.unit} currentValue={amountTarget.value}
          withNote periodMode={amountTarget.monthly ? "monthly" : "daily"} today={today}
          initialPeriod={amountTarget.periodKey} addLabel="ثبت"
          onAdd={(v, note, pk) => addEntry(amountTarget.item.id, pk || amountTarget.periodKey, v, note)} />
      )}
    </div>
  );
}

function ReviewTab({ today, tasks, goals, notes, reviews, saveNote, addReview, deleteReview }) {
  const categories = useContext(CategoriesContext);
  const tKey = dateKey(today.jy, today.jm, today.jd);
  const [noteText, setNoteText] = useState(notes[tKey] || "");
  const [reviewType, setReviewType] = useState("weekly");
  const [strengths, setStrengths] = useState("");
  const [weaknesses, setWeaknesses] = useState("");
  const noteTimer = useRef(null);

  useEffect(() => { setNoteText(notes[tKey] || ""); }, [tKey]); // eslint-disable-line react-hooks/exhaustive-deps

  function handleNoteChange(v) {
    setNoteText(v);
    if (noteTimer.current) clearTimeout(noteTimer.current);
    noteTimer.current = setTimeout(() => saveNote(tKey, v), 500);
  }

  const last7 = useMemo(() => {
    const start = addDaysJalali(today.jy, today.jm, today.jd, -6);
    return Array.from({ length: 7 }, (_, i) => addDaysJalali(start.jy, start.jm, start.jd, i));
  }, [tKey]); // eslint-disable-line react-hooks/exhaustive-deps

  const chartData = last7.map((d) => {
    const dk = dateKey(d.jy, d.jm, d.jd);
    const dayTasks = tasks.filter((t) => t.dateKey === dk);
    const done = dayTasks.filter((t) => t.completed).length;
    const pct = dayTasks.length ? Math.round((done / dayTasks.length) * 100) : 0;
    return { label: PERSIAN_WEEKDAYS_SHORT[persianWeekdayIndex(d.jy, d.jm, d.jd)], value: pct };
  });

  const pieData = categories
    .map((c) => ({ name: c.label, value: goals.filter((g) => g.category === c.id && g.completed).length, fill: (COLOR_PALETTE[c.colorKey] || COLOR_PALETTE.slate).hex }))
    .filter((d) => d.value > 0);

  function periodLabel(r) {
    if (r.type === "monthly") {
      const [jy, jm] = r.periodKey.split("-").map(Number);
      return `${PERSIAN_MONTHS[jm - 1]} ${toFa(jy)}`;
    }
    const [jy, jm, jd] = r.periodKey.split("-").map(Number);
    const end = addDaysJalali(jy, jm, jd, 6);
    return `${toFa(jd)} ${PERSIAN_MONTHS[jm - 1]} تا ${toFa(end.jd)} ${PERSIAN_MONTHS[end.jm - 1]}`;
  }

  function handleAddReview() {
    if (!strengths.trim() && !weaknesses.trim()) return;
    const periodKey = reviewType === "monthly" ? monthKey(today.jy, today.jm) : (() => { const ws = getWeekStart(today.jy, today.jm, today.jd); return dateKey(ws.jy, ws.jm, ws.jd); })();
    addReview({ id: uid(), type: reviewType, periodKey, strengths: strengths.trim(), weaknesses: weaknesses.trim(), createdAtKey: tKey });
    setStrengths(""); setWeaknesses("");
  }

  return (
    <div className="tab-pane">
      <section className="section">
        <div className="section-head"><h3>روند ۷ روز اخیر</h3></div>
        <div className="chart-box">
          <SimpleBarChart data={chartData} height={140} />
        </div>
      </section>

      {pieData.length > 0 && (
        <section className="section">
          <div className="section-head"><h3>اهداف تکمیل‌شده به تفکیک دسته</h3></div>
          <div className="chart-box chart-box-row">
            <SimpleDonutChart data={pieData} size={110} />
            <ul className="legend">
              {pieData.map((d, i) => (
                <li key={i} className="legend-row"><span className="legend-dot" style={{ background: d.fill }} />{d.name}<span className="legend-val">{toFa(d.value)}</span></li>
              ))}
            </ul>
          </div>
        </section>
      )}

      <section className="section">
        <div className="section-head"><h3>یادداشت امروز</h3></div>
        <textarea className="note-area" placeholder="چیزی که امروز به ذهنت رسید را بنویس…" value={noteText} onChange={(e) => handleNoteChange(e.target.value)} />
      </section>

      <section className="section">
        <div className="section-head"><h3>مرور و جمع‌بندی</h3></div>
        <div className="segmented">
          <button className={reviewType === "weekly" ? "seg-active" : ""} onClick={() => setReviewType("weekly")}>این هفته</button>
          <button className={reviewType === "monthly" ? "seg-active" : ""} onClick={() => setReviewType("monthly")}>این ماه</button>
        </div>
        <label className="field-label"><TrendingUp size={13} style={{ verticalAlign: "-2px" }} /> نقاط قوت</label>
        <textarea className="note-area note-area-sm" placeholder="چه چیزی خوب پیش رفت؟" value={strengths} onChange={(e) => setStrengths(e.target.value)} />
        <label className="field-label">نقاط ضعف</label>
        <textarea className="note-area note-area-sm" placeholder="چه چیزی نیاز به بهبود دارد؟" value={weaknesses} onChange={(e) => setWeaknesses(e.target.value)} />
        <button className="primary-btn" onClick={handleAddReview} disabled={!strengths.trim() && !weaknesses.trim()}>ثبت مرور</button>

        {reviews.length > 0 && (
          <ul className="review-list">
            {[...reviews].reverse().map((r) => (
              <li key={r.id} className="review-card">
                <div className="review-card-head">
                  <span className="review-period">{r.type === "monthly" ? "ماهانه" : "هفتگی"} · {periodLabel(r)}</span>
                  <IconBtn onClick={() => deleteReview(r.id)} label="حذف"><Trash2 size={14} /></IconBtn>
                </div>
                {r.strengths && <p className="review-text"><b>قوت:</b> {r.strengths}</p>}
                {r.weaknesses && <p className="review-text"><b>ضعف:</b> {r.weaknesses}</p>}
              </li>
            ))}
          </ul>
        )}
      </section>
    </div>
  );
}

/* =========================================================================
   ROOT APP
   ========================================================================= */

function PlanningApp() {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [goals, setGoals] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [habits, setHabits] = useState([]);
  const [notes, setNotes] = useState({});
  const [reviews, setReviews] = useState([]);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [trackerGroups, setTrackerGroups] = useState([]);
  const [trackerItems, setTrackerItems] = useState([]);
  const [trackerEntries, setTrackerEntries] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [detail, setDetail] = useState(null);
  const [editing, setEditing] = useState(null);
  const [toast, setToast] = useState(null);
  const [systemDark, setSystemDark] = useState(false);
  const today = useMemo(() => todayJalali(), []);
  const didAutoRoll = useRef(false);

  const todayKey = dateKey(today.jy, today.jm, today.jd);
  const curMonthKey = monthKey(today.jy, today.jm);
  const curWeekStart = getWeekStart(today.jy, today.jm, today.jd);
  const curWeekKey = dateKey(curWeekStart.jy, curWeekStart.jm, curWeekStart.jd);

  useEffect(() => {
    const d = loadAll();
    if (d.goals) setGoals(recomputeGoals(d.goals.map(migrateGoal)));
    if (d.tasks) setTasks(d.tasks);
    if (d.habits) setHabits(d.habits.map(migrateHabit));
    if (d.notes) setNotes(d.notes);
    if (d.reviews) setReviews(d.reviews);
    if (d.categories) setCategories(d.categories);
    if (d.trackerGroups) setTrackerGroups(d.trackerGroups.map((g) => ({ period: "daily", archived: false, ...g })));
    if (d.trackerItems) setTrackerItems(d.trackerItems.map((i) => ({ archived: false, ...i })));
    setTrackerEntries(migrateTrackerEntries(d.trackerEntries, d.trackerLogs));
    if (d.settings) setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
    setLoaded(true);
  }, []);

  // Track the OS colour scheme so "auto" can follow it live.
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const apply = () => setSystemDark(!!mq.matches);
    apply();
    if (mq.addEventListener) { mq.addEventListener("change", apply); return () => mq.removeEventListener("change", apply); }
    if (mq.addListener) { mq.addListener(apply); return () => mq.removeListener(apply); }
  }, []);

  const themeMode = settings.theme || "auto";
  const isDark = themeMode === "dark" || (themeMode === "auto" && systemDark);
  useEffect(() => {
    try {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", isDark ? "#131519" : "#2A4374");
    } catch (e) { /* ignore */ }
  }, [isDark]);

  const openDetail = useCallback((d) => setDetail(d), []);
  const closeDetail = useCallback(() => setDetail(null), []);

  // Every goals write funnels through here: one weekly edit can complete a
  // monthly parent, so completion is always re-derived for the whole set.
  const commitGoals = useCallback((updater) => {
    setGoals((prev) => {
      const next = recomputeGoals(typeof updater === "function" ? updater(prev) : updater);
      persist("goals", next);
      return next;
    });
  }, []);

  /* ---- goals ---- */
  const addGoal = useCallback((goal) => {
    if (goal.reminderTime) requestNotifyPermission();
    commitGoals((prev) => [...prev, goal]);
  }, [commitGoals]);
  const toggleGoal = useCallback((id) => commitGoals((prev) => prev.map((g) => g.id === id ? { ...g, completed: !g.completed } : g)), [commitGoals]);
  const updateGoal = useCallback((id, data) => commitGoals((prev) => prev.map((g) => {
    if (g.id !== id) return g;
    const merged = { ...g, ...data };
    if (data.reminderTime !== undefined && data.reminderTime !== g.reminderTime) {
      merged.lastReminderKey = null;
      if (data.reminderTime) requestNotifyPermission();
    }
    return merged;
  })), [commitGoals]);
  const deleteGoal = useCallback((id) => commitGoals((prev) => prev.filter((g) => g.id !== id).map((g) => g.linkedMonthlyId === id ? { ...g, linkedMonthlyId: null } : g)), [commitGoals]);
  const logGoalProgress = useCallback((id, dk, delta, note) => commitGoals((prev) => prev.map((g) =>
    g.id === id ? { ...g, progressEntries: [...(g.progressEntries || []), { id: uid(), dateKey: dk, value: delta, note: note || null }] } : g)), [commitGoals]);
  const updateGoalEntry = useCallback((id, entryId, patch) => commitGoals((prev) => prev.map((g) =>
    g.id === id ? { ...g, progressEntries: (g.progressEntries || []).map((e) => e.id === entryId ? { ...e, ...patch, note: patch.note || null } : e) } : g)), [commitGoals]);
  const clearGoalLogEntry = useCallback((id, entryId) => commitGoals((prev) => prev.map((g) =>
    g.id === id ? { ...g, progressEntries: (g.progressEntries || []).filter((e) => e.id !== entryId) } : g)), [commitGoals]);

  /* ---- tasks ---- */
  const addTask = useCallback((task) => {
    if (task.reminderTime) requestNotifyPermission();
    setTasks((prev) => { const next = [...prev, task]; persist("tasks", next); return next; });
  }, []);
  const toggleTask = useCallback((id) => setTasks((prev) => { const next = prev.map((t) => t.id === id ? { ...t, completed: !t.completed } : t); persist("tasks", next); return next; }), []);
  const updateTask = useCallback((id, data) => setTasks((prev) => {
    const next = prev.map((t) => t.id === id ? { ...t, ...data, reminderFired: data.reminderTime !== t.reminderTime ? false : t.reminderFired } : t);
    persist("tasks", next); return next;
  }), []);
  const deleteTask = useCallback((id) => setTasks((prev) => { const next = prev.filter((t) => t.id !== id); persist("tasks", next); return next; }), []);

  /* ---- habits ---- */
  const addHabit = useCallback((habit) => {
    if (habit.reminderTime) requestNotifyPermission();
    setHabits((prev) => { const next = [...prev, habit]; persist("habits", next); return next; });
  }, []);
  const toggleHabit = useCallback((id, dk) => setHabits((prev) => {
    const next = prev.map((h) => {
      if (h.id !== id) return h;
      const entries = { ...(h.entries || {}) };
      if (entries[dk]) delete entries[dk]; else entries[dk] = true;
      return { ...h, entries };

    persist("habits", next); return next;
  }), []);
  const setHabitValue = useCallback((id, dk, value) => setHabits((prev) => {
    const next = prev.map((h) => {
      if (h.id !== id) return h;
      const entries = { ...(h.entries || {}) };
      if (!value) delete entries[dk]; else entries[dk] = value;
      return { ...h, entries };
    });
    persist("habits", next); return next;
  }), []);
  const updateHabit = useCallback((id, data) => setHabits((prev) => {
    const next = prev.map((h) => {
      if (h.id !== id) return h;
      if (data.reminderTime) requestNotifyPermission();
      return { ...h, ...data, lastReminderKey: data.reminderTime !== h.reminderTime ? null : h.lastReminderKey };
    });
    persist("habits", next); return next;
  }), []);
  const deleteHabit = useCallback((id) => setHabits((prev) => { const next = prev.filter((h) => h.id !== id); persist("habits", next); return next; }), []);

  /* ---- notes / reviews ---- */
  const saveNote = useCallback((dk, text) => setNotes((prev) => { const next = { ...prev, [dk]: text }; persist("notes", next); return next; }), []);
  const addReview = useCallback((review) => setReviews((prev) => { const next = [...prev, review]; persist("reviews", next); return next; }), []);
  const deleteReview = useCallback((id) => setReviews((prev) => { const next = prev.filter((r) => r.id !== id); persist("reviews", next); return next; }), []);

  /* ---- categories & settings ---- */
  const addCategory = useCallback((cat) => setCategories((prev) => { const next = [...prev, cat]; persist("categories", next); return next; }), []);
  const deleteCategory = useCallback((id) => {
    setCategories((prev) => {
      if (prev.length <= 1) return prev;
      const next = prev.filter((c) => c.id !== id);
      const fallback = next[0].id;
      persist("categories", next);
      commitGoals((pg) => pg.map((g) => g.category === id ? { ...g, category: fallback } : g));
      setTasks((pt) => { const nt = pt.map((t) => t.category === id ? { ...t, category: fallback } : t); persist("tasks", nt); return nt; });
      setHabits((ph) => { const nh = ph.map((h) => h.category === id ? { ...h, category: fallback } : h); persist("habits", nh); return nh; });

  /* ---- tracker ---- */
  const addTrackerGroup = useCallback((group) => setTrackerGroups((prev) => { const next = [...prev, group]; persist("trackerGroups", next); return next; }), []);
  const editTrackerGroup = useCallback((id, data) => setTrackerGroups((prev) => { const next = prev.map((g) => g.id === id ? { ...g, ...data } : g); persist("trackerGroups", next); return next; }), []);
  const archiveTrackerGroup = useCallback((id) => setTrackerGroups((prev) => { const next = prev.map((g) => g.id === id ? { ...g, archived: !g.archived } : g); persist("trackerGroups", next); return next; }), []);
  const deleteTrackerGroup = useCallback((id) => {
    setTrackerGroups((prev) => { const next = prev.filter((g) => g.id !== id); persist("trackerGroups", next); return next; });
    setTrackerItems((prev) => {
      const gone = new Set(prev.filter((it) => it.groupId === id).map((it) => it.id));
      const next = prev.filter((it) => it.groupId !== id);
